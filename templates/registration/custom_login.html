<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoliApp | Giriş</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#202523}body{background:#e7e7e4}.screen{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(390px,.75fr)}
.visual{position:relative;min-height:100vh;overflow:hidden;background:#bfc1bd}.visual:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(24,27,26,.52),rgba(38,40,39,.18) 55%,rgba(38,40,39,.05)),url('https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=1800&q=90') center/cover no-repeat;filter:grayscale(1)}.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.25),transparent 45%)}
.quote{position:absolute;z-index:2;left:8%;top:13%;color:#fff;text-transform:uppercase;letter-spacing:5px;font:400 16px/1.9 Georgia,serif;text-shadow:0 2px 12px rgba(0,0,0,.35)}.quote i{display:block;width:38px;border-top:1px solid rgba(255,255,255,.8);margin-top:20px}.caption{position:absolute;z-index:2;left:8%;bottom:7%;color:rgba(255,255,255,.75);font-size:10px;letter-spacing:3px;text-transform:uppercase}
.panel{min-height:100vh;background:#f7f7f5;display:flex;align-items:center;justify-content:center;padding:48px}.box{width:100%;max-width:390px}.brand{text-align:center;margin-bottom:46px}.moli{font-family:Georgia,"Times New Roman",serif;font-size:48px;font-weight:400;letter-spacing:8px;margin-left:8px}.textile{font-size:9px;letter-spacing:6px;margin-top:9px;color:#6b706e}.brandline{width:42px;border-top:1px solid #aeb2b0;margin:25px auto 0}.title{text-align:center;font-size:20px;font-weight:600;margin:0 0 7px}.sub{text-align:center;color:#7b807e;font-size:12px;margin:0 0 30px}.field{position:relative;margin-bottom:13px}.field input{width:100%;height:52px;border:1px solid #d5d8d6;border-radius:3px;background:#fff;padding:0 44px 0 45px;font-size:13px;outline:0}.field input:focus{border-color:#43534f;box-shadow:0 0 0 2px rgba(39,64,58,.08)}.ico{position:absolute;left:15px;top:17px;width:18px;height:18px;color:#44504d}.eye{position:absolute;right:12px;top:14px;border:0;background:none;cursor:pointer;color:#59635f;padding:4px}.opts{display:flex;align-items:center;justify-content:space-between;margin:17px 1px 25px;font-size:11px;color:#525957}.opts label{display:flex;align-items:center;gap:7px}.opts input{accent-color:#263e38}.btn{width:100%;height:52px;border:0;border-radius:3px;background:#263e38;color:white;font-size:13px;font-weight:600;cursor:pointer}.btn:hover{background:#1b302b}.error{font-size:12px;text-align:center;color:#9b332c;background:#fff0ee;border:1px solid #efd0cc;padding:10px;margin-bottom:14px}.foot{text-align:center;margin-top:29px;color:#9b9f9d;font-size:9px;letter-spacing:2px;text-transform:uppercase}
@media(max-width:800px){.screen{display:block}.visual{min-height:36vh}.visual:before{background-position:center}.quote{top:auto;bottom:12%;left:7%;font-size:12px;letter-spacing:3px}.caption{display:none}.panel{min-height:64vh;padding:38px 25px}.brand{margin-bottom:30px}.moli{font-size:40px}}
</style></head><body><div class="screen"><section class="visual"><div class="quote">Tasarımın gücü,<br>üretimin disiplini.<i></i></div><div class="caption">Moli Textile · İzmir</div></section><section class="panel"><div class="box"><div class="brand"><div class="moli">MOLİ</div><div class="textile">TEXTILE</div><div class="brandline"></div></div><h1 class="title">MoliApp'e Hoş Geldiniz</h1><p class="sub">Üretim süreçlerinizi tek yerde yönetin.</p>{% if error %}<div class="error">Kullanıcı adı veya şifre hatalı.</div>{% endif %}<form method="post" action="{% url 'login' %}">{% csrf_token %}<div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 3.5-6.3 8-6.3s7.2 2.1 8 6.3"/></svg><input name="username" autocomplete="username" placeholder="Kullanıcı adı" required autofocus></div><div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" name="password" autocomplete="current-password" placeholder="Şifre" required><button class="eye" type="button" onclick="togglePassword()" aria-label="Şifreyi göster"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><div class="opts"><label><input type="checkbox" name="remember"> Beni hatırla</label></div><button class="btn" type="submit">Giriş Yap</button></form><div class="foot">MoliApp · Üretim Yönetim Sistemi</div></div></section></div><script>function togglePassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}</script></body></html>
