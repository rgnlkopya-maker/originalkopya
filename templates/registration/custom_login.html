{% load static %}<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoliApp | Giriş</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#18211f}body{background:#aaa}.hero{position:relative;width:100%;height:100vh;min-height:650px;display:flex;align-items:center;justify-content:flex-end;padding:5vw 7vw;background:url('{% static "img/moli-login-factory.svg" %}') center/cover no-repeat;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:rgba(25,28,27,.05);pointer-events:none}.slogan{position:absolute;z-index:2;left:6.5vw;top:13vh;color:#fff;font-size:17px;line-height:1.65;letter-spacing:6px;text-transform:uppercase;font-weight:300;text-shadow:0 2px 14px rgba(0,0,0,.35)}.slogan:after{content:"";display:block;width:40px;border-top:1px solid rgba(255,255,255,.9);margin-top:24px}.card{position:relative;z-index:3;width:390px;padding:38px 36px 34px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.8);border-radius:5px;box-shadow:0 18px 55px rgba(0,0,0,.2);backdrop-filter:blur(8px)}.brand{text-align:center}.moli{font:400 43px/1 Georgia,"Times New Roman",serif;letter-spacing:7px;margin-left:7px}.textile{margin-top:9px;font-size:8px;letter-spacing:6px;color:#69716e}.app{font-size:20px;font-weight:650;text-align:center;margin:27px 0 5px}.desc{text-align:center;color:#777e7c;font-size:12px;margin:0 0 27px}.field{position:relative;margin-bottom:13px}.field input{width:100%;height:48px;border:1px solid #d4d8d6;border-radius:4px;background:#fff;padding:0 42px 0 43px;font-size:13px;outline:none}.field input:focus{border-color:#53635f;box-shadow:0 0 0 2px rgba(40,62,57,.07)}.ico{position:absolute;left:14px;top:15px;width:18px;height:18px}.eye{position:absolute;right:11px;top:12px;border:0;background:none;padding:5px;cursor:pointer}.meta{display:flex;justify-content:space-between;align-items:center;margin:16px 1px 23px;font-size:11px}.remember{display:flex;gap:7px;align-items:center}.remember input{accent-color:#233b35}.forgot{color:#343b39;text-decoration:none}.btn{width:100%;height:49px;border:0;border-radius:4px;background:#213a34;color:#fff;font-size:13px;font-weight:650;cursor:pointer}.btn:hover{background:#172d28}.error{font-size:11px;text-align:center;color:#9b302a;background:#fff1ef;border:1px solid #efd0cc;padding:9px;margin-bottom:13px}.foot{text-align:center;margin-top:22px;font-size:8px;letter-spacing:2px;color:#949a97;text-transform:uppercase}@media(max-width:700px){.hero{min-height:100vh;padding:24px;justify-content:center;background-position:center}.hero:before{content:"";position:absolute;inset:0;background:rgba(20,23,22,.28)}.slogan{top:5vh;left:7vw;font-size:11px;letter-spacing:3px}.card{margin-top:80px;width:min(390px,100%);padding:32px 25px}.moli{font-size:38px}}</style></head><body><main class="hero"><div class="slogan">İYİ TASARIM<br>PLANLI ÜRETİMLE<br>HAYAT BULUR.</div><section class="card"><div class="brand"><div class="moli">MOLİ</div><div class="textile">TEXTILE</div></div><div class="app">MoliApp</div><p class="desc">Üretim süreçlerinizi tek yerde yönetin.</p>{% if error %}<div class="error">Kullanıcı adı veya şifre hatalı.</div>{% endif %}<form method="post" action="{% url 'login' %}">{% csrf_token %}<div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 3.5-6.3 8-6.3s7.2 2.1 8 6.3"/></svg><input name="username" autocomplete="username" placeholder="Kullanıcı adı" required autofocus></div><div class="field"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><input id="password" type="password" name="password" autocomplete="current-password" placeholder="Şifre" required><button class="eye" type="button" onclick="togglePassword()" aria-label="Şifreyi göster"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></button></div><div class="meta"><label class="remember"><input type="checkbox" name="remember"> Beni hatırla</label><span class="forgot">Şifremi unuttum?</span></div><button class="btn" type="submit">Giriş Yap</button></form><div class="foot">MoliApp · Üretim Yönetim Sistemi</div></section></main><script>function togglePassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password'}</script></body></html>
