{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoliApp | Giriş</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#d8d8d6;color:#17201e;min-height:100vh;overflow:hidden}
        .page{min-height:100vh;position:relative;display:flex;align-items:center;justify-content:flex-end;padding:48px 9%;background:
          linear-gradient(90deg,rgba(20,24,23,.38),rgba(20,24,23,.08) 48%,rgba(20,24,23,.22)),
          url('https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=2200&q=85') center/cover no-repeat;filter:grayscale(100%)}
        .page:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.18));pointer-events:none}
        .statement{position:absolute;z-index:2;left:7%;top:14%;color:white;font-size:16px;letter-spacing:7px;line-height:1.85;text-transform:uppercase;text-shadow:0 2px 12px rgba(0,0,0,.25);max-width:270px}
        .statement:after{content:"";display:block;width:38px;height:1px;background:rgba(255,255,255,.8);margin-top:22px}
        .card{position:relative;z-index:3;width:min(430px,100%);padding:48px 42px 42px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.65);border-radius:6px;box-shadow:0 25px 70px rgba(0,0,0,.22);backdrop-filter:blur(10px);filter:none}
        .brand{text-align:center;margin-bottom:30px}
        .logo{font-family:Georgia,"Times New Roman",serif;font-size:46px;letter-spacing:8px;font-weight:500;line-height:1;color:#17201e;margin-left:8px}
        .textile{font-size:9px;letter-spacing:6px;margin-top:10px;color:#5e6764;text-transform:uppercase}
        h1{text-align:center;font-size:22px;font-weight:650;margin-top:28px;margin-bottom:7px}
        .subtitle{text-align:center;color:#737b79;font-size:13px;margin-bottom:30px}
        .field{position:relative;margin-bottom:14px}
        .field input{width:100%;height:52px;border:1px solid #d4d9d7;border-radius:5px;background:#fff;padding:0 45px 0 46px;font-size:14px;outline:none;transition:.2s}
        .field input:focus{border-color:#243b36;box-shadow:0 0 0 3px rgba(36,59,54,.08)}
        .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:#293633}
        .eye{position:absolute;right:16px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:#52605d;padding:3px}
        .row{display:flex;align-items:center;justify-content:space-between;margin:17px 1px 24px;font-size:12px;color:#313a38}
        .remember{display:flex;gap:8px;align-items:center}
        .remember input{accent-color:#203c36}
        .error{background:#fff1f0;color:#a22d25;border:1px solid #f2c9c6;padding:10px 12px;border-radius:5px;font-size:12px;margin-bottom:15px;text-align:center}
        .login-btn{width:100%;height:54px;border:0;border-radius:5px;background:#1d332f;color:white;font-weight:650;font-size:14px;cursor:pointer;transition:.2s}
        .login-btn:hover{background:#142824;transform:translateY(-1px)}
        .footer{text-align:center;margin-top:24px;color:#8b918f;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
        @media(max-width:760px){body{overflow:auto}.page{justify-content:center;padding:28px 18px;background-position:center}.statement{display:none}.card{padding:38px 26px}.logo{font-size:40px}.page:before{background:rgba(0,0,0,.28)}}
    </style>
</head>
<body>
<div class="page">
    <div class="statement">İyi tasarım<br>planlı üretimle<br>hayat bulur.</div>
    <main class="card">
        <div class="brand">
            <div class="logo">MOLİ</div>
            <div class="textile">TEXTILE</div>
            <h1>MoliApp</h1>
            <p class="subtitle">Üretim süreçlerinizi tek yerde yönetin.</p>
        </div>

        {% if error %}<div class="error">Kullanıcı adı veya şifre hatalı.</div>{% endif %}

        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="field">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c.8-4.2 3.5-6.3 8-6.3s7.2 2.1 8 6.3"/></svg>
                <input type="text" name="username" autocomplete="username" placeholder="Kullanıcı adı" required autofocus>
            </div>
            <div class="field">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
                <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Şifre" required>
                <button class="eye" type="button" aria-label="Şifreyi göster" onclick="togglePassword()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg>
                </button>
            </div>
            <div class="row">
                <label class="remember"><input type="checkbox" name="remember"> Beni hatırla</label>
            </div>
            <button class="login-btn" type="submit">Giriş Yap</button>
        </form>
        <div class="footer">MoliApp · Üretim Yönetim Sistemi</div>
    </main>
</div>
<script>
function togglePassword(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';}
</script>
</body>
</html>
