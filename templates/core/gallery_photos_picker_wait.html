{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width:700px">
  <h2>Google Photos'tan Fotoğraf Seç</h2>
  <p>Google Photos seçim ekranını yeni sekmede açın. Fotoğrafları seçip Google ekranında işlemi tamamladıktan sonra buradan kontrol edin.</p>
  <p><a href="{{ picker_uri }}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">Google Photos'u Aç</a></p>
  <button id="photosCheck" type="button" class="btn btn-outline-primary">Seçimi Kontrol Et</button>
  <p id="photosStatus" role="status" class="mt-3"></p>
  <p><a href="{% url 'product_gallery' %}?album={{ request.GET.album|default:'' }}&group={{ group_id }}">Albüme dön</a></p>
</div>
<script>
document.getElementById('photosCheck').addEventListener('click',async function(){
 const status=document.getElementById('photosStatus');
 this.disabled=true;status.textContent='Google Photos kontrol ediliyor...';
 try {
   const response=await fetch("{% url 'gallery_photos_picker_status' %}",{credentials:'same-origin'});
   const data=await response.json();
   if(!response.ok)throw Error(data.error||'Bağlantı hatası');
   status.textContent=data.ready ? data.count+' fotoğraf seçildi. Aktarım altyapısı hazırlanıyor; fotoğraflar henüz MoliApp\'e kopyalanmadı.' : 'Seçim henüz tamamlanmadı. Google Photos sekmesinden fotoğrafları seçip tamamlayın.';
 }catch(err){status.textContent=err.message;}finally{this.disabled=false;}
});
</script>
{% endblock %}
