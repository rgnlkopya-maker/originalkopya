const originals=new WeakMap();
function lang(){return localStorage.getItem('moli_guest_language_v1')||'tr'}
function apply(){const l=lang();document.querySelectorAll('body *').forEach(el=>{if(el.children.length)return;let o=originals.get(el);if(o===undefined){o=(el.textContent||'').trim();if(S[o])originals.set(el,o)}if(!o||!S[o])return;el.textContent=l==='tr'?o:(S[o][l]||o)});}
