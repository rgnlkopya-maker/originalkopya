    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--moli-bg);color:var(--moli-text);font-family:"Plus Jakarta Sans",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.guest-shell{min-height:100vh}.guest-topbar{min-height:58px;background:#fff;border-bottom:1px solid #edf0f5;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.04);padding:7px 10px}.guest-topbar-inner{width:min(100%,760px);display:flex;align-items:center;justify-content:space-between;gap:10px}.guest-brand{font-size:14px;letter-spacing:.28em;font-weight:800;color:#39405a;white-space:nowrap}.guest-language{height:38px;max-width:205px;border:1px solid #dfe4ee;border-radius:12px;background:#fff;color:#263044;padding:0 10px;font-size:12px;font-weight:700;outline:none}.guest-language:focus{border-color:#9eabff;box-shadow:0 0 0 3px rgba(74,99,255,.08)}.guest-page{width:min(100% - 24px,620px);margin:0 auto;padding:18px 0 38px}.guest-eyebrow{font-size:11px;font-weight:800;color:#7b8597;letter-spacing:.08em;text-transform:uppercase}.guest-title{font-size:28px;line-height:1.15;font-weight:800;margin:4px 0 5px;color:#20283a}.guest-subtitle{font-size:13px;line-height:1.5;color:var(--moli-muted);margin:0}.guest-head{margin:4px 2px 16px}.guest-card{background:var(--moli-card);border:1px solid var(--moli-border);border-radius:18px;box-shadow:var(--moli-shadow)}.guest-btn{min-height:44px;border:0;border-radius:14px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--moli-blue);color:#fff;text-decoration:none;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(74,99,255,.22);cursor:pointer}.guest-btn:hover{background:var(--moli-blue-dark);color:#fff}.guest-btn.secondary{background:#fff;color:#39405a;border:1px solid #dfe4ee;box-shadow:none}.guest-btn.soft{background:var(--moli-soft);color:#39405a;border:1px solid #e3e6fb;box-shadow:none}.guest-btn.danger{background:#fff;color:var(--moli-danger);border:1px solid #f0d7d7;box-shadow:none}.guest-btn.block{width:100%}.guest-success{background:#ecf8f0;border:1px solid #cfe9d7;color:#287244;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:12px}.guest-note{font-size:12px;color:#7b8597;line-height:1.5}.guest-pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--moli-soft);border:1px solid #e3e6fb;color:#39405a;font-size:11px;font-weight:700}.guest-section-title{font-size:14px;font-weight:800;color:#263044}.guest-field label{display:block;font-size:10px;font-weight:800;color:#747f94;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.guest-field input,.guest-field select{width:100%;height:46px;border:1px solid #dfe4ee;border-radius:12px;background:#fff;padding:0 12px;font-size:16px;color:#20283a;outline:none}.guest-field input:focus,.guest-field select:focus{border-color:#9eabff;box-shadow:0 0 0 3px rgba(74,99,255,.10)}html[dir="rtl"] body{text-align:right}html[dir="rtl"] .guest-topbar-inner,html[dir="rtl"] .hero,html[dir="rtl"] .cart-main,html[dir="rtl"] .item-main{direction:rtl}html[dir="rtl"] .guest-btn i{margin-left:0}

const originalText=new WeakMap(), originalAttrs=new WeakMap();
function tr(text,lang){if(lang==='tr')return text;const exact=D[text];if(exact&&exact[lang])return exact[lang];let m=text.match(/^(\d+)\s+adet$/i);if(m){const u={en:'items',de:'Stk.',ar:'قطعة',fr:'articles',it:'articoli',es:'artículos',ru:'шт.',sq:'copë',el:'τεμ.',ku:'heb',fa:'عدد'};return m[1]+' '+(u[lang]||'adet');}m=text.match(/^(.+) için anlaşılan fiyatı girin\.$/);if(m){const s={en:'Enter the agreed price for ',de:'Vereinbarten Preis eingeben für ',ar:'أدخل السعر المتفق عليه لـ ',fr:'Saisissez le prix convenu pour ',it:'Inserisci il prezzo concordato per ',es:'Introduzca el precio acordado para ',ru:'Введите согласованную цену для ',sq:'Vendosni çmimin e rënë dakord për ',el:'Εισαγάγετε τη συμφωνημένη τιμή για ',ku:'Bihayê lihevhatî binivîse ji bo ',fa:'قیمت توافق‌شده را وارد کنید برای '};return (s[lang]||'')+m[1]+'.';}return text;}
function translateNode(node,lang){if(node.nodeType===Node.TEXT_NODE){if(!originalText.has(node))originalText.set(node,node.nodeValue);const src=originalText.get(node),lead=(src.match(/^\s*/)||[''])[0],trail=(src.match(/\s*$/)||[''])[0],core=src.trim();if(core)node.nodeValue=lead+tr(core,lang)+trail;return;}if(node.nodeType!==Node.ELEMENT_NODE)return;if(['SCRIPT','STYLE'].includes(node.tagName))return;let attrs=originalAttrs.get(node);if(!attrs){attrs={};['placeholder','title','aria-label'].forEach(a=>{if(node.hasAttribute(a))attrs[a]=node.getAttribute(a)});originalAttrs.set(node,attrs);}Object.entries(attrs).forEach(([a,v])=>node.setAttribute(a,tr(v,lang)));Array.from(node.childNodes).forEach(n=>translateNode(n,lang));}
function apply(lang){if(!LANGS.includes(lang))lang='tr';document.documentElement.lang=lang;document.documentElement.dir=RTL.has(lang)?'rtl':'ltr';translateNode(document.body,lang);if(!originalText.has(document.querySelector('title'))){/* title handled below */}const titleMap={'Sepetim | Moli':{en:'My Cart | Moli',de:'Mein Warenkorb | Moli',ar:'سلتي | Moli',fr:'Mon panier | Moli',it:'Il mio carrello | Moli',es:'Mi carrito | Moli',ru:'Моя корзина | Moli',sq:'Shporta ime | Moli',el:'Το καλάθι μου | Moli',ku:'Selika min | Moli',fa:'سبد من | Moli'},'Sepet Kodu | Moli':{en:'Cart Code | Moli',de:'Warenkorbcode | Moli',ar:'رمز السلة | Moli',fr:'Code panier | Moli',it:'Codice carrello | Moli',es:'Código del carrito | Moli',ru:'Код корзины | Moli',sq:'Kodi i shportës | Moli',el:'Κωδικός καλαθιού | Moli',ku:'Koda selikê | Moli',fa:'کد سبد | Moli'},'Müşteri Sepeti | Moli':{en:'Customer Cart | Moli',de:'Kundenwarenkorb | Moli',ar:'سلة العميل | Moli',fr:'Panier client | Moli',it:'Carrello cliente | Moli',es:'Carrito del cliente | Moli',ru:'Корзина клиента | Moli',sq:'Shporta e klientit | Moli',el:'Καλάθι πελάτη | Moli',ku:'Selika mişterî | Moli',fa:'سبد مشتری | Moli'}};if(!window.__moliOriginalTitle)window.__moliOriginalTitle=document.title;document.title=lang==='tr'?window.__moliOriginalTitle:((titleMap[window.__moliOriginalTitle]||{})[lang]||window.__moliOriginalTitle);const sel=document.getElementById('moliGuestLanguage');if(sel)sel.value=lang;localStorage.setItem(KEY,lang);window.MoliGuestI18n={lang:lang,t:(s)=>tr(s,lang),apply:apply};}
document.addEventListener('DOMContentLoaded',function(){const select=document.getElementById('moliGuestLanguage');const saved=localStorage.getItem(KEY);const browser=(navigator.language||'tr').slice(0,2).toLowerCase();const initial=LANGS.includes(saved)?saved:(LANGS.includes(browser)?browser:'tr');apply(initial);if(select)select.addEventListener('change',()=>apply(select.value));const obs=new MutationObserver(ms=>{const lang=(window.MoliGuestI18n&&window.MoliGuestI18n.lang)||initial;ms.forEach(m=>m.addedNodes.forEach(n=>translateNode(n,lang)));});obs.observe(document.body,{childList:true,subtree:true});});
})();
