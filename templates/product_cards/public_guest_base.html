<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}Moli{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root{--moli-bg:#f3f4f8;--moli-card:#fff;--moli-text:#111827;--moli-muted:#64748b;--moli-blue:#4a63ff;--moli-blue-dark:#3b54e9;--moli-soft:#eef1ff;--moli-border:#e6eaf2;--moli-danger:#d53333;--moli-shadow:0 7px 22px rgba(15,23,42,.06)}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--moli-bg);color:var(--moli-text);font-family:"Plus Jakarta Sans",sans-serif;-webkit-font-smoothing:antialiased}button,input,select{font:inherit}.guest-shell{min-height:100vh}.guest-topbar{height:58px;background:#fff;border-bottom:1px solid #edf0f5;display:flex;align-items:center;justify-content:center;position:sticky;top:0;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,.04)}.guest-brand{font-size:14px;letter-spacing:.28em;font-weight:800;color:#39405a}.guest-page{width:min(100% - 24px,620px);margin:0 auto;padding:18px 0 38px}.guest-eyebrow{font-size:11px;font-weight:800;color:#7b8597;letter-spacing:.08em;text-transform:uppercase}.guest-title{font-size:28px;line-height:1.15;font-weight:800;margin:4px 0 5px;color:#20283a}.guest-subtitle{font-size:13px;line-height:1.5;color:var(--moli-muted);margin:0}.guest-head{margin:4px 2px 16px}.guest-card{background:var(--moli-card);border:1px solid var(--moli-border);border-radius:18px;box-shadow:var(--moli-shadow)}.guest-btn{min-height:44px;border:0;border-radius:14px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--moli-blue);color:#fff;text-decoration:none;font-size:13px;font-weight:700;box-shadow:0 4px 12px rgba(74,99,255,.22);cursor:pointer}.guest-btn:hover{background:var(--moli-blue-dark);color:#fff}.guest-btn.secondary{background:#fff;color:#39405a;border:1px solid #dfe4ee;box-shadow:none}.guest-btn.soft{background:var(--moli-soft);color:#39405a;border:1px solid #e3e6fb;box-shadow:none}.guest-btn.danger{background:#fff;color:var(--moli-danger);border:1px solid #f0d7d7;box-shadow:none}.guest-btn.block{width:100%}.guest-success{background:#ecf8f0;border:1px solid #cfe9d7;color:#287244;border-radius:14px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:12px}.guest-note{font-size:12px;color:#7b8597;line-height:1.5}.guest-pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 10px;border-radius:999px;background:var(--moli-soft);border:1px solid #e3e6fb;color:#39405a;font-size:11px;font-weight:700}.guest-section-title{font-size:14px;font-weight:800;color:#263044}.guest-field label{display:block;font-size:10px;font-weight:800;color:#747f94;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}.guest-field input,.guest-field select{width:100%;height:46px;border:1px solid #dfe4ee;border-radius:12px;background:#fff;padding:0 12px;font-size:16px;color:#20283a;outline:none}.guest-field input:focus,.guest-field select:focus{border-color:#9eabff;box-shadow:0 0 0 3px rgba(74,99,255,.10)}
    @media(max-width:560px){.guest-page{width:min(100% - 18px,620px);padding-top:14px}.guest-title{font-size:24px}.guest-topbar{height:52px}}
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body><div class="guest-shell"><div class="guest-topbar"><div class="guest-brand">MOLİ</div></div>{% block content %}{% endblock %}</div>{% block extra_js %}{% endblock %}</body>
</html>
