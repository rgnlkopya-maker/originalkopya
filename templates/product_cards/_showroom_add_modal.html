<style>
#showroomAddModal .modal-dialog{width:94vw;max-width:94vw;height:92vh;margin:4vh auto}
#showroomAddModal .modal-content{height:92vh;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
#showroomAddModal .modal-body{overflow-y:auto;flex:1 1 auto;min-height:0;padding-bottom:24px}
#showroomAddModal .modal-footer{position:sticky;bottom:0;z-index:30;flex:0 0 auto;background:#fff;border-top:1px solid #e5e7eb;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px rgba(15,23,42,.08)}
#showroomAddModal .select2-search__field,#showroomAddModal .select2-selection__rendered{font-size:16px!important}
.showroom-customer-wrap{max-width:720px!important}.showroom-customer-inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.showroom-customer-add-btn{height:44px;border:0;border-radius:22px;padding:0 15px;background:#263b80;color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.showroom-customer-add-btn:hover{background:#1f316c;color:#fff}
#showroomCustomerModal{z-index:13020!important}.showroom-customer-modal-open .modal-backdrop{z-index:13010!important}.showroom-customer-modal .modal-content{border:0;border-radius:18px;overflow:hidden}.showroom-customer-modal .modal-header{padding:16px 18px;border-bottom:1px solid #edf0f5}.showroom-customer-modal .modal-title{font-size:17px;font-weight:850}.showroom-customer-modal .modal-body{padding:18px;max-height:72vh;overflow:auto}.showroom-customer-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.showroom-customer-field.full{grid-column:1/-1}.showroom-customer-field label{display:block;font-size:9px;font-weight:850;text-transform:uppercase;color:#7d8799;margin-bottom:5px}.showroom-customer-field input,.showroom-customer-field textarea{width:100%;border:1px solid #dfe4ed;border-radius:11px;padding:10px 11px;font-size:13px;background:#fff}.showroom-customer-field textarea{min-height:75px;resize:vertical}.showroom-customer-section{font-size:11px;font-weight:900;color:#39405a;margin:6px 0 0;grid-column:1/-1;border-bottom:1px solid #edf0f5;padding-bottom:6px}.showroom-customer-modal .modal-footer{border-top:1px solid #edf0f5;padding:12px 18px}.showroom-customer-save{background:#4a63ff;border-color:#4a63ff;font-weight:800}
@media(max-width:768px){#showroomAddModal .modal-dialog{width:96vw;max-width:96vw;height:90vh;margin:5vh auto}#showroomAddModal .modal-content{height:90vh;border-radius:14px}#showroomAddModal input,#showroomAddModal select,#showroomAddModal textarea,.select2-container--open .select2-search__field{font-size:16px!important}#showroomAddModal .modal-footer{gap:8px}.showroom-customer-inline{grid-template-columns:1fr}.showroom-customer-add-btn{width:100%}.showroom-customer-form-grid{grid-template-columns:1fr}.showroom-customer-field.full,.showroom-customer-section{grid-column:auto}}
</style>
<div class="modal fade" id="showroomAddModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content showroom-modal-content"><div class="modal-header"><div><div class="small text-muted">SİPARİŞ FÖYÜ</div><h5 class="modal-title mb-0">Föye Ürün Ekle</h5></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3 mb-3"><div class="col-md-4"><label class="form-label">Sipariş Tipi</label><div class="form-control showroom-fixed-field">Seri</div></div><div class="col-md-4"><label class="form-label">Ürün Kodu</label><input id="showroomProductCode" type="text" class="form-control" readonly></div></div><div class="showroom-manage-row mb-3"><button type="button" class="manage-btn" data-bs-toggle="modal" data-bs-target="#renkModal">🎨 Renk Yönet</button><button type="button" class="manage-btn" data-bs-toggle="modal" data-bs-target="#bedenModal">👕 Beden Yönet</button></div><div id="showroomRows"></div><button type="button" id="showroomAddRow" class="btn btn-success mt-2">+ Satır Ekle</button></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Kapat</button><button type="button" id="showroomSaveItem" class="btn btn-primary">Föye Ekle</button></div></div></div></div>

<div class="modal fade showroom-customer-modal" id="showroomCustomerModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form id="showroomCustomerForm"><div class="modal-header"><div><h5 class="modal-title">Yeni Müşteri Ekle</h5><div class="small text-muted">Bu müşteri Müşteriler ve Yeni Sipariş Gir ekranlarında da aynı kayıt olarak görünecek.</div></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="showroom-customer-form-grid"><div class="showroom-customer-section">Temel Bilgiler</div><div class="showroom-customer-field"><label>Müşteri / Firma Adı</label><input name="ad" required autocomplete="off"></div><div class="showroom-customer-field"><label>Yetkili Kişi</label><input name="yetkili_kisi"></div><div class="showroom-customer-field"><label>Telefon</label><input name="telefon" inputmode="tel"></div><div class="showroom-customer-field"><label>İkinci Telefon</label><input name="telefon_2" inputmode="tel"></div><div class="showroom-customer-field"><label>E-posta</label><input type="email" name="email"></div><div class="showroom-customer-field"><label>Ülke</label><input name="ulke"></div><div class="showroom-customer-field full"><label>Çalıştığı Dış Ticaret Firması</label><input name="dis_ticaret_firmasi"></div><div class="showroom-customer-section">Adresler</div><div class="showroom-customer-field full"><label>Adres</label><textarea name="adres"></textarea></div><div class="showroom-customer-field"><label>Teslimat Adresi</label><textarea name="teslimat_adresi"></textarea></div><div class="showroom-customer-field"><label>Fatura Adresi</label><textarea name="fatura_adresi"></textarea></div><div class="showroom-customer-section">Müşteri Notları</div><div class="showroom-customer-field full"><label>Notlar</label><textarea name="notlar"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Vazgeç</button><button type="submit" class="btn btn-primary showroom-customer-save"><i class="bi bi-check2 me-1"></i>Müşteriyi Kaydet</button></div></form></div></div></div>

{% include "multi_order/_modals.html" %}
<script>
document.addEventListener('DOMContentLoaded',function(){
 const STORAGE_KEY='moli_showroom_active_draft_v1',ACTION_URL='{% url "showroom_draft_action" %}',LOAD_URL='{% url "showroom_draft_load" %}',CUSTOMER_URL='{% url "ajax_musteri_ekle" %}';
 try{const x=new XMLHttpRequest();x.open('GET',LOAD_URL,false);x.send(null);if(x.status>=200&&x.status<300){const d=JSON.parse(x.responseText||'{}');if(!d.draft)localStorage.removeItem(STORAGE_KEY)}}catch(e){}
 const addRowBtn=document.getElementById('showroomAddRow');
 if(addRowBtn&&window.jQuery){addRowBtn.addEventListener('click',function(){setTimeout(function(){$('.renk-select').each(function(){if($(this).hasClass('select2-hidden-accessible'))$(this).select2('close')});const $lastColor=$('.renk-select').last();if($lastColor.length)$lastColor.val(null).trigger('change.select2')},0)})}
 const actions=document.querySelector('.price-actions'),openBtn=document.getElementById('showroomCreateBtn');
 if(actions&&openBtn&&!document.getElementById('showroomDraftsBtn')){
   const drafts=document.createElement('a');drafts.id='showroomDraftsBtn';drafts.className='showroom-create-btn';drafts.href='{% url "showroom_drafts_page" %}';drafts.textContent='Taslak Föyler';drafts.style.textDecoration='none';
   const approved=document.createElement('a');approved.id='showroomApprovedBtn';approved.className='showroom-create-btn';approved.href='{% url "showroom_approved_page" %}';approved.textContent='Onaylanan Föyler';approved.style.textDecoration='none';
   openBtn.insertAdjacentElement('afterend',drafts);drafts.insertAdjacentElement('afterend',approved);
 }
 function csrf(){const m=document.cookie.match(/(?:^|; )csrftoken=([^;]*)/);return m?decodeURIComponent(m[1]):''}
 function installCustomerButton(){
   const select=document.getElementById('showroomSheetCustomer');
   if(!select||document.getElementById('showroomCustomerAddBtn'))return;
   const parent=select.parentElement;if(!parent)return;
   const inline=document.createElement('div');inline.className='showroom-customer-inline';
   select.parentNode.insertBefore(inline,select);inline.appendChild(select);
   const btn=document.createElement('button');btn.type='button';btn.id='showroomCustomerAddBtn';btn.className='showroom-customer-add-btn';btn.innerHTML='<i class="bi bi-plus-lg"></i> Yeni Müşteri Ekle';inline.appendChild(btn);
   btn.addEventListener('click',function(){document.body.classList.add('showroom-customer-modal-open');bootstrap.Modal.getOrCreateInstance(document.getElementById('showroomCustomerModal')).show();});
 }
 const sheet=document.getElementById('showroomSheet');if(sheet){new MutationObserver(installCustomerButton).observe(sheet,{childList:true,subtree:true});setTimeout(installCustomerButton,0);setTimeout(installCustomerButton,400);}
 const customerModal=document.getElementById('showroomCustomerModal'),customerForm=document.getElementById('showroomCustomerForm');
 if(customerModal){customerModal.addEventListener('hidden.bs.modal',function(){document.body.classList.remove('showroom-customer-modal-open');});}
 if(customerForm){customerForm.addEventListener('submit',async function(e){
   e.preventDefault();const saveBtn=customerForm.querySelector('.showroom-customer-save');saveBtn.disabled=true;
   try{
     const formData=new FormData(customerForm);const r=await fetch(CUSTOMER_URL,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:formData});const data=await r.json();
     if(!data.id)throw new Error(data.message||'Müşteri kaydedilemedi.');
     const select=document.getElementById('showroomSheetCustomer');if(!select)throw new Error('Müşteri seçim alanı bulunamadı.');
     let option=Array.from(select.options).find(o=>String(o.value)===String(data.id));if(!option){option=new Option(data.ad||formData.get('ad'),String(data.id));select.add(option);}
     select.value=String(data.id);select.dispatchEvent(new Event('change',{bubbles:true}));
     bootstrap.Modal.getOrCreateInstance(customerModal).hide();customerForm.reset();
     if(data.success===false&&data.message)alert(data.message+' Mevcut kayıt Föye seçildi.');
   }catch(err){alert(err.message||'Müşteri kaydedilemedi.');}finally{saveBtn.disabled=false;}
 });}
 async function runAction(action){const r=await fetch(ACTION_URL,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({action})}),data=await r.json();if(!r.ok||!data.ok)throw new Error(data.message||'İşlem yapılamadı.');localStorage.removeItem(STORAGE_KEY);return data}
 async function clearAnyRecreatedDraft(){
   await new Promise(resolve=>setTimeout(resolve,700));
   try{await fetch(ACTION_URL,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({action:'delete'})});}catch(e){}
   try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
 }
 document.addEventListener('click',async function(e){
   const save=e.target.closest('#showroomDraftSaveBtn'),del=e.target.closest('#showroomDraftDeleteBtn'),approve=e.target.closest('#showroomApproveBtn');
   if(!save&&!del&&!approve)return;
   if(del&&!confirm('Açık taslak tamamen silinsin mi?'))return;
   if(approve&&!confirm('Bu Föy onaylanan sipariş olarak kaydedilsin mi?'))return;
   const btn=save||del||approve;btn.disabled=true;
   try{
     const data=await runAction(save?'save_draft':del?'delete':'approve');
     await clearAnyRecreatedDraft();
     alert(data.message);
     window.location.href='{% url "showroom_page" %}';
   }catch(err){alert(err.message);btn.disabled=false}
 });
 if(window.jQuery){$(document).on('select2:open',function(){setTimeout(function(){const search=document.querySelector('.select2-container--open .select2-search__field');if(search)search.style.fontSize='16px'},0)})}
});
</script>
