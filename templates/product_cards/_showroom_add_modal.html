<style>
#showroomAddModal .modal-dialog{width:94vw;max-width:94vw;height:92vh;margin:4vh auto}
#showroomAddModal .modal-content{height:92vh;border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
#showroomAddModal .modal-body{overflow-y:auto;flex:1 1 auto;min-height:0;padding-bottom:24px}
#showroomAddModal .modal-footer{position:sticky;bottom:0;z-index:30;flex:0 0 auto;background:#fff;border-top:1px solid #e5e7eb;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 20px rgba(15,23,42,.08)}
#showroomAddModal .select2-search__field,#showroomAddModal .select2-selection__rendered{font-size:16px!important}
.showroom-customer-wrap{max-width:520px!important}.showroom-customer-inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}.showroom-customer-add-btn{height:44px;border:0;border-radius:22px;padding:0 15px;background:#263b80;color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}.showroom-customer-add-btn:hover{background:#1f316c;color:#fff}
.showroom-products-box{background:#fff;border:1px solid #e4e9f1;border-radius:16px;padding:14px 16px 16px;margin-bottom:14px}.showroom-products-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.showroom-products-toolbar-title{font-size:14px;font-weight:900;color:#263044}.showroom-products-toolbar #showroomManualProductBtn{margin:0!important;width:auto!important;min-width:128px}.showroom-product-field{position:relative}.showroom-product-menu{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:13150;max-height:270px;overflow-y:auto;background:#fff;border:1px solid #d1d5db;border-radius:10px;box-shadow:0 12px 30px rgba(15,23,42,.18);padding:4px 0}.showroom-product-menu.open{display:block}.showroom-product-option{display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px 12px;font-size:14px;color:#111827;cursor:pointer}.showroom-product-option:hover{background:#eef2ff}.showroom-product-empty{padding:10px 12px;color:#6b7280;font-size:13px}
#showroomCustomerModal{z-index:13020!important}.showroom-customer-modal-open .modal-backdrop{z-index:13010!important}.showroom-customer-modal .modal-content{border:0;border-radius:18px;overflow:hidden}.showroom-customer-modal .modal-header{padding:16px 18px;border-bottom:1px solid #edf0f5}.showroom-customer-modal .modal-title{font-size:17px;font-weight:850}.showroom-customer-modal .modal-body{padding:18px;max-height:72vh;overflow:auto}.showroom-customer-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.showroom-customer-field.full{grid-column:1/-1}.showroom-customer-field label{display:block;font-size:9px;font-weight:850;text-transform:uppercase;color:#7d8799;margin-bottom:5px}.showroom-customer-field input,.showroom-customer-field textarea{width:100%;border:1px solid #dfe4ed;border-radius:11px;padding:10px 11px;font-size:13px;background:#fff}.showroom-customer-field textarea{min-height:75px;resize:vertical}.showroom-customer-section{font-size:11px;font-weight:900;color:#39405a;margin:6px 0 0;grid-column:1/-1;border-bottom:1px solid #edf0f5;padding-bottom:6px}.showroom-customer-modal .modal-footer{border-top:1px solid #edf0f5;padding:12px 18px}.showroom-customer-save{background:#4a63ff;border-color:#4a63ff;font-weight:800}
@media(max-width:768px){#showroomAddModal .modal-dialog{width:96vw;max-width:96vw;height:90vh;margin:5vh auto}#showroomAddModal .modal-content{height:90vh;border-radius:14px}#showroomAddModal input,#showroomAddModal select,#showroomAddModal textarea,.select2-container--open .select2-search__field{font-size:16px!important}#showroomAddModal .modal-footer{gap:8px}.showroom-customer-inline{grid-template-columns:1fr}.showroom-customer-add-btn{width:100%}.showroom-customer-form-grid{grid-template-columns:1fr}.showroom-customer-field.full,.showroom-customer-section{grid-column:auto}.showroom-products-toolbar{align-items:stretch;flex-direction:column}.showroom-products-toolbar #showroomManualProductBtn{width:100%!important}}
</style>
<div class="modal fade" id="showroomAddModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content showroom-modal-content"><div class="modal-header"><div><div class="small text-muted">SİPARİŞ FÖYÜ</div><h5 class="modal-title mb-0">Föye Ürün Ekle</h5></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3 mb-3"><div class="col-md-4"><label class="form-label">Sipariş Tipi</label><div class="form-control showroom-fixed-field">Seri</div></div><div class="col-md-4 showroom-product-field"><label class="form-label">Ürün Kodu</label><input id="showroomProductCode" type="text" class="form-control" readonly><div id="showroomProductMenu" class="showroom-product-menu"></div></div></div><div class="showroom-manage-row mb-3"><button type="button" class="manage-btn" data-bs-toggle="modal" data-bs-target="#renkModal">🎨 Renk Yönet</button><button type="button" class="manage-btn" data-bs-toggle="modal" data-bs-target="#bedenModal">👕 Beden Yönet</button></div><div id="showroomRows"></div><button type="button" id="showroomAddRow" class="btn btn-success mt-2">+ Satır Ekle</button></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Kapat</button><button type="button" id="showroomSaveItem" class="btn btn-primary">Föye Ekle</button></div></div></div></div>

<div class="modal fade showroom-customer-modal" id="showroomCustomerModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><form id="showroomCustomerForm"><div class="modal-header"><div><h5 class="modal-title">Yeni Müşteri Ekle</h5><div class="small text-muted">Bu müşteri Müşteriler ve Yeni Sipariş Gir ekranlarında da aynı kayıt olarak görünecek.</div></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="showroom-customer-form-grid"><div class="showroom-customer-section">Temel Bilgiler</div><div class="showroom-customer-field"><label>Müşteri / Firma Adı</label><input name="ad" required autocomplete="off"></div><div class="showroom-customer-field"><label>Yetkili Kişi</label><input name="yetkili_kisi"></div><div class="showroom-customer-field"><label>Telefon</label><input name="telefon" inputmode="tel"></div><div class="showroom-customer-field"><label>İkinci Telefon</label><input name="telefon_2" inputmode="tel"></div><div class="showroom-customer-field"><label>E-posta</label><input type="email" name="email"></div><div class="showroom-customer-field"><label>Ülke</label><input name="ulke"></div><div class="showroom-customer-field full"><label>Çalıştığı Dış Ticaret Firması</label><input name="dis_ticaret_firmasi"></div><div class="showroom-customer-section">Adresler</div><div class="showroom-customer-field full"><label>Adres</label><textarea name="adres"></textarea></div><div class="showroom-customer-field"><label>Teslimat Adresi</label><textarea name="teslimat_adresi"></textarea></div><div class="showroom-customer-field"><label>Fatura Adresi</label><textarea name="fatura_adresi"></textarea></div><div class="showroom-customer-section">Müşteri Notları</div><div class="showroom-customer-field full"><label>Notlar</label><textarea name="notlar"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Vazgeç</button><button type="submit" class="btn btn-primary showroom-customer-save"><i class="bi bi-check2 me-1"></i>Müşteriyi Kaydet</button></div></form></div></div></div>

{% include "multi_order/_modals.html" %}
<script>
(function(){
 const BASE_KEY='moli_showroom_active_draft_v1';
 const USER_KEY=BASE_KEY+':user:{{ request.user.id|default:"anon" }}';
 if(window.__moliShowroomStorageIsolated)return;
 window.__moliShowroomStorageIsolated=true;
 const proto=Storage.prototype;
 const nativeGet=proto.getItem,nativeSet=proto.setItem,nativeRemove=proto.removeItem;
 function mapped(key){return key===BASE_KEY?USER_KEY:key;}
 proto.getItem=function(key){return nativeGet.call(this,mapped(key));};
 proto.setItem=function(key,value){return nativeSet.call(this,mapped(key),value);};
 proto.removeItem=function(key){return nativeRemove.call(this,mapped(key));};
 try{nativeRemove.call(localStorage,BASE_KEY);}catch(e){}
})();

document.addEventListener('DOMContentLoaded',function(){
 const STORAGE_KEY='moli_showroom_active_draft_v1',ACTION_URL='{% url "showroom_draft_action" %}',LOAD_URL='{% url "showroom_draft_load" %}',CUSTOMER_URL='{% url "ajax_musteri_ekle" %}';
 try{const x=new XMLHttpRequest();x.open('GET',LOAD_URL,false);x.send(null);if(x.status>=200&&x.status<300){const d=JSON.parse(x.responseText||'{}');if(!d.draft)localStorage.removeItem(STORAGE_KEY)}}catch(e){}
 const addRowBtn=document.getElementById('showroomAddRow');
 if(addRowBtn&&window.jQuery){addRowBtn.addEventListener('click',function(){setTimeout(function(){$('.renk-select').each(function(){if($(this).hasClass('select2-hidden-accessible'))$(this).select2('close')});const $lastColor=$('.renk-select').last();if($lastColor.length)$lastColor.val(null).trigger('change.select2')},0)})}
 const actions=document.querySelector('.price-actions'),openBtn=document.getElementById('showroomCreateBtn');
 if(actions&&openBtn&&!document.getElementById('showroomDraftsBtn')){
   const drafts=document.createElement('a');drafts.id='showroomDraftsBtn';drafts.className='showroom-create-btn';drafts.href='{% url "showroom_drafts_page" %}';drafts.textContent='Taslak Föyler';drafts.style.textDecoration='none';
   const approved=document.createElement('a');approved.id='showroomApprovedBtn';approved.className='showroom-create-btn';approved.href='{% url "showroom_approved_page" %}';approved.textContent='Onaylanan Föyler';approved.style.textDecoration='none';
   openBtn.insertAdjacentElement('afterend',drafts);drafts.insertAdjacentElement('afterend',approved);
 }
 function csrf(){const m=document.cookie.match(/(?:^|; )csrftoken=([^;]*)/);return m?decodeURIComponent(m[1]):''}
 function installCustomerButton(){
   const select=document.getElementById('showroomSheetCustomer');
   if(!select||document.getElementById('showroomCustomerAddBtn'))return;
   const parent=select.parentElement;if(!parent)return;
   const inline=document.createElement('div');inline.className='showroom-customer-inline';
   select.parentNode.insertBefore(inline,select);inline.appendChild(select);
   const btn=document.createElement('button');btn.type='button';btn.id='showroomCustomerAddBtn';btn.className='showroom-customer-add-btn';btn.innerHTML='<i class="bi bi-plus-lg"></i> Yeni Müşteri Ekle';inline.appendChild(btn);
   btn.addEventListener('click',function(){document.body.classList.add('showroom-customer-modal-open');bootstrap.Modal.getOrCreateInstance(document.getElementById('showroomCustomerModal')).show();});
 }
 const sheet=document.getElementById('showroomSheet');if(sheet){new MutationObserver(installCustomerButton).observe(sheet,{childList:true,subtree:true});setTimeout(installCustomerButton,0);setTimeout(installCustomerButton,400);}
 const customerModal=document.getElementById('showroomCustomerModal'),customerForm=document.getElementById('showroomCustomerForm');
 if(customerModal){customerModal.addEventListener('hidden.bs.modal',function(){document.body.classList.remove('showroom-customer-modal-open');});}
 if(customerForm){customerForm.addEventListener('submit',async function(e){
   e.preventDefault();const saveBtn=customerForm.querySelector('.showroom-customer-save');saveBtn.disabled=true;
   try{
     const formData=new FormData(customerForm);const r=await fetch(CUSTOMER_URL,{method:'POST',credentials:'same-origin',headers:{'X-CSRFToken':csrf()},body:formData});const data=await r.json();
     if(!data.id)throw new Error(data.message||'Müşteri kaydedilemedi.');
     const select=document.getElementById('showroomSheetCustomer');if(!select)throw new Error('Müşteri seçim alanı bulunamadı.');
     let option=Array.from(select.options).find(o=>String(o.value)===String(data.id));if(!option){option=new Option(data.ad||formData.get('ad'),String(data.id));select.add(option);}
     select.value=String(data.id);select.dispatchEvent(new Event('change',{bubbles:true}));
     bootstrap.Modal.getOrCreateInstance(customerModal).hide();customerForm.reset();
     if(data.success===false&&data.message)alert(data.message+' Mevcut kayıt Föye seçildi.');
   }catch(err){alert(err.message||'Müşteri kaydedilemedi.');}finally{saveBtn.disabled=false;}
 });}

 const productModal=document.getElementById('showroomAddModal'),productInput=document.getElementById('showroomProductCode'),productMenu=document.getElementById('showroomProductMenu');
 let manualReturnPending=false;
 function normalizeProduct(v){return String(v||'').toLocaleLowerCase('tr').trim();}
 function activeProductCodes(){const source=document.getElementById('modal_urun_kod_listesi');if(!source)return[];return Array.from(source.options).filter(o=>o.value&&o.textContent.trim()).map(o=>o.textContent.trim());}
 function exactProduct(value){const q=normalizeProduct(value);return activeProductCodes().find(code=>normalizeProduct(code)===q)||'';}
 function renderProductMenu(term){if(!productMenu||!productInput||productInput.hasAttribute('readonly'))return;const q=normalizeProduct(term),matches=activeProductCodes().filter(code=>!q||normalizeProduct(code).includes(q)).slice(0,100);productMenu.innerHTML='';if(!matches.length){const empty=document.createElement('div');empty.className='showroom-product-empty';empty.textContent='Sonuç bulunamadı';productMenu.appendChild(empty);}else{matches.forEach(code=>{const btn=document.createElement('button');btn.type='button';btn.className='showroom-product-option';btn.textContent=code;btn.addEventListener('mousedown',e=>e.preventDefault());btn.addEventListener('click',function(){productInput.value=code;productMenu.classList.remove('open');productInput.dispatchEvent(new Event('change',{bubbles:true}));});productMenu.appendChild(btn);});}productMenu.classList.add('open');}
 function installProductsBox(){if(!sheet)return;const list=sheet.querySelector('#showroomSheetItems');if(!list)return;let box=sheet.querySelector('.showroom-products-box');if(!box){box=document.createElement('section');box.className='showroom-products-box';const toolbar=document.createElement('div');toolbar.className='showroom-products-toolbar';toolbar.innerHTML='<div class="showroom-products-toolbar-title">Ürünler</div>';list.parentNode.insertBefore(box,list);box.appendChild(toolbar);box.appendChild(list);}const toolbar=box.querySelector('.showroom-products-toolbar'),manualBtn=document.getElementById('showroomManualProductBtn');if(manualBtn&&toolbar&&!toolbar.contains(manualBtn))toolbar.appendChild(manualBtn);}
 if(sheet){new MutationObserver(function(){installCustomerButton();installProductsBox();}).observe(sheet,{childList:true,subtree:true});setTimeout(installProductsBox,0);setTimeout(installProductsBox,500);}
 if(productInput&&productMenu){productInput.removeAttribute('list');productInput.addEventListener('focus',()=>renderProductMenu(productInput.value));productInput.addEventListener('click',()=>renderProductMenu(productInput.value));productInput.addEventListener('input',()=>renderProductMenu(productInput.value));productInput.addEventListener('keydown',function(e){if(e.key==='Escape')productMenu.classList.remove('open');if(e.key==='Enter'&&productMenu.classList.contains('open')){const first=productMenu.querySelector('.showroom-product-option');if(first){e.preventDefault();first.click();}}});productInput.addEventListener('blur',function(){setTimeout(()=>productMenu.classList.remove('open'),120);});}
 document.addEventListener('click',function(e){if(productMenu&&productInput&&!productInput.parentElement.contains(e.target))productMenu.classList.remove('open');},true);
 document.addEventListener('click',function(e){const manage=e.target.closest('#showroomProductManageBtn');if(manage&&document.body.classList.contains('showroom-manual-product'))manualReturnPending=true;},true);
 if(productModal){productModal.addEventListener('shown.bs.modal',function(){installProductsBox();if(!productInput.hasAttribute('readonly')){document.body.classList.add('showroom-manual-product');setTimeout(()=>renderProductMenu(productInput.value),120);}if(manualReturnPending)manualReturnPending=false;});productModal.addEventListener('hidden.bs.modal',function(){if(manualReturnPending)setTimeout(()=>document.body.classList.add('showroom-manual-product'),0);if(productMenu)productMenu.classList.remove('open');});}
 const productManageModal=document.getElementById('urunKodModal');if(productManageModal){productManageModal.addEventListener('hidden.bs.modal',function(){if(manualReturnPending){document.body.classList.add('showroom-manual-product');setTimeout(function(){if(productInput){productInput.removeAttribute('readonly');const exact=exactProduct(productInput.value);if(exact)productInput.value=exact;}bootstrap.Modal.getOrCreateInstance(productModal).show();},180);}});}
 const saveItemBtn=document.getElementById('showroomSaveItem');if(saveItemBtn){saveItemBtn.addEventListener('click',function(e){if(!document.body.classList.contains('showroom-manual-product'))return;const exact=exactProduct(productInput.value);if(!exact){e.preventDefault();e.stopImmediatePropagation();alert('Lütfen aktif ürün kodlarından birini seçin.');productInput.focus();renderProductMenu(productInput.value);return;}productInput.value=exact;},true);}

 async function runAction(action){const r=await fetch(ACTION_URL,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({action})}),data=await r.json();if(!r.ok||!data.ok)throw new Error(data.message||'İşlem yapılamadı.');localStorage.removeItem(STORAGE_KEY);return data}
 async function clearAnyRecreatedDraft(){
   await new Promise(resolve=>setTimeout(resolve,700));
   try{await fetch(ACTION_URL,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({action:'delete'})});}catch(e){}
   try{localStorage.removeItem(STORAGE_KEY)}catch(e){}
 }
 document.addEventListener('click',async function(e){
   const save=e.target.closest('#showroomDraftSaveBtn'),del=e.target.closest('#showroomDraftDeleteBtn'),approve=e.target.closest('#showroomApproveBtn');
   if(!save&&!del&&!approve)return;
   if(del&&!confirm('Açık taslak tamamen silinsin mi?'))return;
   if(approve&&!confirm('Bu Föy onaylanan sipariş olarak kaydedilsin mi?'))return;
   const btn=save||del||approve;btn.disabled=true;
   try{
     const data=await runAction(save?'save_draft':del?'delete':'approve');
     await clearAnyRecreatedDraft();
     alert(data.message);
     window.location.href='{% url "showroom_page" %}';
   }catch(err){alert(err.message);btn.disabled=false}
 });
 if(window.jQuery){$(document).on('select2:open',function(){setTimeout(function(){const search=document.querySelector('.select2-container--open .select2-search__field');if(search)search.style.fontSize='16px'},0)})}
});
</script>
