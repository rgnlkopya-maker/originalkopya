<style>
#showroomAddModal .modal-dialog{
  width:94vw;
  max-width:94vw;
  height:92vh;
  margin:4vh auto;
}
#showroomAddModal .modal-content{
  height:92vh;
  border-radius:18px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
}
#showroomAddModal .modal-body{
  overflow-y:auto;
  flex:1 1 auto;
  min-height:0;
  padding-bottom:24px;
}
#showroomAddModal .modal-footer{
  position:sticky;
  bottom:0;
  z-index:30;
  flex:0 0 auto;
  background:#fff;
  border-top:1px solid #e5e7eb;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 20px rgba(15,23,42,.08);
}
#showroomAddModal .select2-search__field,
#showroomAddModal .select2-selection__rendered{
  font-size:16px !important;
}
@media(max-width:768px){
  #showroomAddModal .modal-dialog{
    width:96vw;
    max-width:96vw;
    height:90vh;
    margin:5vh auto;
  }
  #showroomAddModal .modal-content{
    height:90vh;
    border-radius:14px;
  }
  #showroomAddModal input,
  #showroomAddModal select,
  #showroomAddModal textarea,
  .select2-container--open .select2-search__field{
    font-size:16px !important;
  }
  #showroomAddModal .modal-footer{
    gap:8px;
  }
  #showroomAddModal .modal-footer .btn{
    min-height:44px;
  }
}
</style>
<div class="modal fade" id="showroomAddModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content showroom-modal-content">
      <div class="modal-header">
        <div>
          <div class="small text-muted">SİPARİŞ FÖYÜ</div>
          <h5 class="modal-title mb-0">Föye Ürün Ekle</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3 mb-3">
          <div class="col-md-4">
            <label class="form-label">Sipariş Tipi</label>
            <div class="form-control showroom-fixed-field">Seri</div>
          </div>
          <div class="col-md-4">
            <label class="form-label">Ürün Kodu</label>
            <input id="showroomProductCode" type="text" class="form-control" readonly>
          </div>
        </div>

        <div class="showroom-manage-row mb-3">
          <button type="button" class="manage-btn" data-bs-toggle="modal" data-bs-target="#renkModal">🎨 Renk Yönet</button>
          <button type="button" class="manage-btn" data-bs-toggle="modal" data-bs-target="#bedenModal">👕 Beden Yönet</button>
        </div>

        <div id="showroomRows"></div>
        <button type="button" id="showroomAddRow" class="btn btn-success mt-2">+ Satır Ekle</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Kapat</button>
        <button type="button" id="showroomSaveItem" class="btn btn-primary">Föye Ekle</button>
      </div>
    </div>
  </div>
</div>

{% include "multi_order/_modals.html" %}

<script>
document.addEventListener('DOMContentLoaded', function () {
  const addRowBtn = document.getElementById('showroomAddRow');
  if (addRowBtn && window.jQuery) {
    addRowBtn.addEventListener('click', function () {
      setTimeout(function () {
        $('.renk-select').each(function () {
          if ($(this).hasClass('select2-hidden-accessible')) {
            $(this).select2('close');
          }
        });
        const $lastColor = $('.renk-select').last();
        if ($lastColor.length) {
          $lastColor.val(null).trigger('change.select2');
        }
      }, 0);
    });
  }

  if (window.jQuery) {
    $(document).on('select2:open', function () {
      setTimeout(function () {
        const search = document.querySelector('.select2-container--open .select2-search__field');
        if (search) {
          search.style.fontSize = '16px';
        }
      }, 0);
    });
  }
});
</script>
