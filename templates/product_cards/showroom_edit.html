{% extends "base.html" %}
{% block content %}
<style>
.foy-edit-page{max-width:1180px;margin:0 auto;padding:24px 14px 50px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.head h2{margin:0;font-weight:850}.actions{display:flex;gap:8px}.btnx{border-radius:22px;padding:10px 18px;font-weight:800;border:1px solid #dfe5ee;background:#fff;color:#39445a;text-decoration:none}.save{background:#4650d8;color:#fff;border-color:#4650d8}.box{background:#fff;border:1px solid #e4e9f1;border-radius:16px;padding:17px;margin-bottom:13px}.top-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}.lbl{display:block;font-size:11px;font-weight:800;color:#7c879b;margin-bottom:5px}.control{width:100%;border:1px solid #dce2ea;border-radius:10px;padding:10px;font-size:16px}.product-head{display:grid;grid-template-columns:1fr 180px auto;gap:10px;align-items:end}.code{font-size:19px;font-weight:900}.rows{margin-top:12px;display:grid;gap:8px}.rowx{display:grid;grid-template-columns:1fr 1.2fr 90px 1.5fr auto;gap:8px;align-items:end}.remove{border:1px solid #f0caca;background:#fff;color:#c73535;border-radius:9px;padding:10px}.addrow{margin-top:10px;border:1px solid #dce2ff;background:#eef1ff;color:#3b45d9;border-radius:9px;padding:8px 12px;font-weight:750}.totals{max-width:440px;margin-left:auto}.tr{display:flex;justify-content:space-between;padding:7px 0}.grand{border-top:1px solid #dfe4ec;margin-top:5px;padding-top:12px;font-size:19px;font-weight:900}@media(max-width:750px){.head{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions>*{flex:1;text-align:center}.top-grid{grid-template-columns:1fr}.product-head{grid-template-columns:1fr}.rowx{grid-template-columns:1fr 1fr}.rowx .desc{grid-column:1/-1}.remove{grid-column:1/-1}.totals{max-width:none}}
</style>
<main class="foy-edit-page">
<div class="head"><div><div class="text-muted small">SİPARİŞ FÖYÜ · #{{ draft.id }}</div><h2>Föyü Düzenle</h2></div><div class="actions"><a class="btnx" href="{% url 'showroom_detail_page' draft.id %}">Vazgeç</a><button id="saveBtn" class="btnx save" type="button">Kaydet</button></div></div>
<section class="box top-grid"><div><label class="lbl">Müşteri</label><select id="customer" class="control"><option value="">Müşteri seçilmedi</option>{% for m in musteriler %}<option value="{{ m.id }}" {% if draft.customer_id == m.id %}selected{% endif %}>{{ m.ad }}</option>{% endfor %}</select></div><div><label class="lbl">İndirim Oranı (%)</label><input id="rate" class="control" type="number" min="0" max="100" step="0.01" value="{{ draft.discount_rate }}"></div><div><label class="lbl">İndirim Tutarı (TL)</label><input id="amount" class="control" type="number" min="0" step="0.01" value="{{ draft.overall_discount_amount }}"></div></section>
<div id="products">
{% for item in items %}<section class="box product" data-code="{{ item.urun_kodu }}"><div class="product-head"><div><span class="lbl">Ürün Kodu</span><div class="code">{{ item.urun_kodu }}</div></div><div><label class="lbl">Anlaşılan Fiyat (TL)</label><input class="control price" type="number" min="0" step="0.01" value="{{ item.anlasilan_fiyat }}"></div><span></span></div><div class="rows">{% for row in item.satirlar %}<div class="rowx"><div><label class="lbl">Renk</label><select class="control color">{% for r in renkler %}<option value="{{ r.ad }}" {% if r.ad == row.renk %}selected{% endif %}>{{ r.ad }}</option>{% endfor %}</select></div><div><label class="lbl">Beden</label><select class="control sizes" multiple>{% for b in bedenler %}<option value="{{ b.ad }}" {% if b.ad in row.bedenler %}selected{% endif %}>{{ b.ad }}</option>{% endfor %}</select></div><div><label class="lbl">Adet</label><input class="control qty" type="number" min="1" value="{{ row.adet }}"></div><div class="desc"><label class="lbl">Açıklama</label><input class="control description" value="{{ row.aciklama }}"></div><button class="remove" type="button">Sil</button></div>{% endfor %}</div><button class="addrow" type="button">+ Satır Ekle</button></section>{% endfor %}
</div>
<section class="box totals"><div class="tr"><span>Ara Toplam</span><strong id="subtotal">0,00 TL</strong></div><div class="tr"><span>İndirim</span><strong id="discount">-0,00 TL</strong></div><div class="tr grand"><span>Genel Toplam</span><span id="grand">0,00 TL</span></div></section>
</main>
<script>
document.addEventListener('DOMContentLoaded',function(){
 const colors=[{% for r in renkler %}'{{ r.ad|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}],sizes=[{% for b in bedenler %}'{{ b.ad|escapejs }}'{% if not forloop.last %},{% endif %}{% endfor %}];
 const money=v=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(v)+' TL';
 function csrf(){const m=document.cookie.match(/(?:^|; )csrftoken=([^;]*)/);return m?decodeURIComponent(m[1]):'';}
 function rowHtml(){return `<div class="rowx"><div><label class="lbl">Renk</label><select class="control color">${colors.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div><label class="lbl">Beden</label><select class="control sizes" multiple>${sizes.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div><label class="lbl">Adet</label><input class="control qty" type="number" min="1" value="1"></div><div class="desc"><label class="lbl">Açıklama</label><input class="control description"></div><button class="remove" type="button">Sil</button></div>`;}
 function calc(){let sub=0;document.querySelectorAll('.product').forEach(p=>{const price=Number(p.querySelector('.price').value)||0;p.querySelectorAll('.rowx').forEach(r=>{sub+=price*(Number(r.querySelector('.qty').value)||0)*Array.from(r.querySelector('.sizes').selectedOptions).length})});let rate=Number(document.getElementById('rate').value)||0,amount=Number(document.getElementById('amount').value)||0,disc=rate>0?sub*rate/100:amount;disc=Math.min(sub,Math.max(0,disc));document.getElementById('subtotal').textContent=money(sub);document.getElementById('discount').textContent='-'+money(disc);document.getElementById('grand').textContent=money(Math.max(0,sub-disc));}
 document.getElementById('rate').addEventListener('input',function(){if(Number(this.value)>0)document.getElementById('amount').value=0;calc()});document.getElementById('amount').addEventListener('input',function(){if(Number(this.value)>0)document.getElementById('rate').value=0;calc()});document.addEventListener('input',e=>{if(e.target.closest('.product'))calc()});document.addEventListener('change',e=>{if(e.target.closest('.product'))calc()});
 document.addEventListener('click',e=>{const add=e.target.closest('.addrow');if(add){add.previousElementSibling.insertAdjacentHTML('beforeend',rowHtml());return}const rem=e.target.closest('.remove');if(rem){rem.closest('.rowx').remove();calc();}});
 document.getElementById('saveBtn').addEventListener('click',async function(){const btn=this;const items=[];document.querySelectorAll('.product').forEach(p=>{const rows=[];p.querySelectorAll('.rowx').forEach(r=>rows.push({renk:r.querySelector('.color').value,bedenler:Array.from(r.querySelector('.sizes').selectedOptions).map(o=>o.value),adet:Number(r.querySelector('.qty').value)||1,aciklama:r.querySelector('.description').value}));items.push({urun_kodu:p.dataset.code,anlasilan_fiyat:Number(p.querySelector('.price').value)||0,satirlar:rows})});btn.disabled=true;try{const res=await fetch('{% url "showroom_edit_save" draft.id %}',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify({customer_id:document.getElementById('customer').value,discount_rate:document.getElementById('rate').value,discount_amount:document.getElementById('amount').value,items})}),data=await res.json();if(!res.ok||!data.ok)throw new Error(data.message||'Kaydedilemedi.');window.location.href='{% url "showroom_detail_page" draft.id %}';}catch(err){alert(err.message);btn.disabled=false;}});calc();
});
</script>
{% endblock %}
