<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOLI {{ card.urun.kod }} QR Etiketi</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f8;font-family:Arial,sans-serif;color:#111827}.toolbar{padding:16px;text-align:center}.toolbar button,.toolbar a{display:inline-block;border:0;border-radius:10px;padding:11px 18px;margin:4px;background:#4a63ff;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.toolbar a{background:#fff;color:#39405a;border:1px solid #dfe4ee}.sheet{display:flex;justify-content:center;padding:10px}.label{width:70mm;min-height:100mm;background:#fff;border:1px solid #e5e7eb;padding:7mm;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.brand{font-size:18pt;font-weight:800;letter-spacing:.28em;margin-left:.28em}.code{font-size:22pt;font-weight:800;margin:4mm 0 2mm}.qr{width:45mm;height:45mm;object-fit:contain}.scan{font-size:10pt;font-weight:700;margin-top:3mm}.small{font-size:7.5pt;color:#6b7280;margin-top:1.5mm}.url{font-size:6.5pt;color:#9ca3af;margin-top:3mm;word-break:break-all}@page{size:70mm 100mm;margin:0}@media print{body{background:#fff}.toolbar{display:none}.sheet{padding:0}.label{border:0;width:70mm;height:100mm;min-height:100mm}}</style></head><body><div class="toolbar"><button onclick="window.print()">Etiketi Yazdır</button><a href="{% url 'product_card_detail' card.id %}">Ürün Kartına Dön</a></div><div class="sheet"><div class="label"><div class="brand">MOLI</div><div class="code">{{ card.urun.kod }}</div><img class="qr" src="{% url 'product_qr_png' card.id %}" alt="{{ card.urun.kod }} QR"><div class="scan">SCAN TO DISCOVER</div><div class="small">Ürünü keşfet • Sepetine ekle</div><div class="url">{{ public_url }}</div></div></div></body></html>
