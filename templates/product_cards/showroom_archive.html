{% extends "base.html" %}
{% block content %}
<style>
.foy-archive{max-width:1250px;margin:0 auto;padding:24px 14px 50px}.foy-archive-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.foy-search-row{display:flex;justify-content:flex-end;margin-bottom:18px}.foy-search-group{display:flex;align-items:center;gap:3px;padding:4px;border:1px solid #e3e7f0;border-radius:24px;background:#f6f8fc}.foy-search-box{width:280px;height:34px;border:0;background:transparent;outline:0;padding:0 13px;border-radius:18px;color:#263044}.foy-search-clear{width:34px;height:34px;border:0;border-radius:18px;background:transparent;color:#687386;display:flex;align-items:center;justify-content:center}.foy-search-clear:hover{background:#fff;color:#3448cf;box-shadow:0 2px 8px rgba(15,23,42,.08)}.foy-search-empty{display:none}.foy-archive-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:14px}.foy-archive-head h2{margin:0;font-weight:850}.foy-back{border:1px solid #e1e7f0;border-radius:22px;background:#fff;color:#39405a;text-decoration:none;padding:10px 17px;font-weight:700}.foy-list{display:grid;gap:12px}.foy-card{background:#fff;border:1px solid #e4e9f1;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(3,minmax(100px,.7fr)) minmax(145px,.8fr) auto;gap:14px;align-items:center}.foy-customer{font-size:17px;font-weight:850;color:#263044}.foy-label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#8a94a6;margin-bottom:3px}.foy-value{font-weight:750;color:#39445a}.foy-actions{display:flex;gap:7px}.foy-detail-btn,.foy-print-btn{border-radius:10px;padding:9px 13px;font-weight:800;text-decoration:none;text-align:center;white-space:nowrap}.foy-detail-btn{border:1px solid #dce2ff;background:#eef1ff;color:#3b45d9}.foy-print-btn{border:1px solid #d8e2dc;background:#f3f8f5;color:#2d6b48}.foy-empty{background:#fff;border:1px dashed #cfd7e6;border-radius:16px;padding:45px 20px;text-align:center;color:#8a94a6}@media(max-width:800px){.foy-card{grid-template-columns:1fr 1fr}.foy-card>div:first-child{grid-column:1/-1}.foy-actions{grid-column:1/-1}.foy-actions a{flex:1}.foy-search-row{justify-content:stretch}.foy-search-group{width:100%}.foy-search-box{width:auto;flex:1;min-width:0}}
</style>
<main class="foy-archive"><div class="foy-archive-head"><div><div class="text-muted small">SİPARİŞ FÖYÜ</div><h2>{{ archive_title }}</h2></div><a class="foy-back" href="{% url 'showroom_page' %}">Sipariş Föyüne Dön</a></div><div class="foy-search-row"><div class="foy-search-group"><input id="foySearchInput" class="foy-search-box" type="search" autocomplete="off" placeholder="Müşteri, föy no veya ürün ara"><button id="foySearchClear" class="foy-search-clear" type="button" title="Aramayı temizle" aria-label="Aramayı temizle"><i class="bi bi-x-lg"></i></button></div></div><div id="foyArchiveList" class="foy-list"><div class="foy-empty">Yükleniyor…</div></div><div id="foySearchEmpty" class="foy-empty foy-search-empty">Aramaya uygun kayıt bulunamadı.</div></main>
<script>
document.addEventListener('DOMContentLoaded',async function(){
const kind='{{ archive_kind|escapejs }}',list=document.getElementById('foyArchiveList'),search=document.getElementById('foySearchInput'),clear=document.getElementById('foySearchClear'),empty=document.getElementById('foySearchEmpty'),money=v=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' TL',esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
let items=[];
const detailBase='{% url "showroom_detail_page" 0 %}'.replace('/0/','/__ID__/'),printBase='{% url "showroom_print_page" 0 %}'.replace('/0/','/__ID__/');
function norm(v){return String(v??'').toLocaleLowerCase('tr-TR').trim()}
function render(){
 const q=norm(search.value);
 const rows=!q?items:items.filter(x=>[x.id,x.customer,x.updated_at,x.product_count,x.total_qty,x.discount,x.total].some(v=>norm(v).includes(q)));
 if(!items.length){list.innerHTML='<div class="foy-empty">Henüz kayıt bulunmuyor.</div>';empty.style.display='none';return}
 list.innerHTML=rows.map(x=>`<div class="foy-card"><div><span class="foy-label">Müşteri</span><div class="foy-customer">${esc(x.customer)}</div><div class="text-muted small">Föy #${esc(x.id)} · ${esc(x.updated_at)}</div></div><div><span class="foy-label">Ürün Çeşidi</span><span class="foy-value">${x.product_count}</span></div><div><span class="foy-label">Toplam Adet</span><span class="foy-value">${x.total_qty}</span></div><div><span class="foy-label">İndirim</span><span class="foy-value">${money(x.discount)}</span></div><div><span class="foy-label">Genel Toplam</span><span class="foy-value">${money(x.total)}</span></div><div class="foy-actions"><a class="foy-detail-btn" href="${detailBase.replace('__ID__',x.id)}">Detay</a><a class="foy-print-btn" href="${printBase.replace('__ID__',x.id)}">Yazdır</a></div></div>`).join('');
 empty.style.display=rows.length?'none':'block';
}
search.addEventListener('input',render);
clear.addEventListener('click',function(){search.value='';render();search.focus()});
try{
 const r=await fetch('{% url "showroom_archive_list" %}?kind='+encodeURIComponent(kind),{credentials:'same-origin'}),data=await r.json();
 if(!r.ok||!data.ok)throw new Error(data.message||'Liste alınamadı.');
 items=data.items||[];
 render();
}catch(e){list.innerHTML='<div class="foy-empty">'+esc(e.message)+'</div>'}
});
</script>
{% endblock %}
