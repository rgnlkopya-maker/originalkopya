{% extends "base.html" %}
{% block content %}
<style>
.foy-archive{max-width:1250px;margin:0 auto;padding:24px 14px 50px}.foy-archive-head{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}.foy-archive-head h2{margin:0;font-weight:850}.foy-back{border:1px solid #e1e7f0;border-radius:22px;background:#fff;color:#39405a;text-decoration:none;padding:10px 17px;font-weight:700}.foy-list{display:grid;gap:12px}.foy-card{background:#fff;border:1px solid #e4e9f1;border-radius:16px;padding:16px 18px;display:grid;grid-template-columns:minmax(180px,1.5fr) repeat(3,minmax(100px,.7fr)) minmax(145px,.8fr) auto;gap:14px;align-items:center}.foy-customer{font-size:17px;font-weight:850;color:#263044}.foy-label{display:block;font-size:10px;font-weight:800;text-transform:uppercase;color:#8a94a6;margin-bottom:3px}.foy-value{font-weight:750;color:#39445a}.foy-detail-btn{border:1px solid #dce2ff;background:#eef1ff;color:#3b45d9;border-radius:10px;padding:9px 14px;font-weight:800;text-decoration:none;text-align:center}.foy-empty{background:#fff;border:1px dashed #cfd7e6;border-radius:16px;padding:45px 20px;text-align:center;color:#8a94a6}@media(max-width:800px){.foy-card{grid-template-columns:1fr 1fr}.foy-card>div:first-child{grid-column:1/-1}.foy-detail-btn{grid-column:1/-1;width:100%}}
</style>
<main class="foy-archive">
 <div class="foy-archive-head"><div><div class="text-muted small">SİPARİŞ FÖYÜ</div><h2>{{ archive_title }}</h2></div><a class="foy-back" href="{% url 'showroom_page' %}">Sipariş Föyüne Dön</a></div>
 <div id="foyArchiveList" class="foy-list"><div class="foy-empty">Yükleniyor…</div></div>
</main>
<script>
document.addEventListener('DOMContentLoaded',async function(){
 const kind='{{ archive_kind|escapejs }}',list=document.getElementById('foyArchiveList');
 const money=v=>new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' TL';
 const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
 try{
  const r=await fetch('{% url "showroom_archive_list" %}?kind='+encodeURIComponent(kind),{credentials:'same-origin'}),data=await r.json();
  if(!r.ok||!data.ok)throw new Error(data.message||'Liste alınamadı.');
  if(!data.items.length){list.innerHTML='<div class="foy-empty">Henüz kayıt bulunmuyor.</div>';return;}
  const detailBase='{% url "showroom_detail_page" 0 %}'.replace('/0/','/__ID__/');
  list.innerHTML=data.items.map(x=>`<div class="foy-card"><div><span class="foy-label">Müşteri</span><div class="foy-customer">${esc(x.customer)}</div><div class="text-muted small">${esc(x.updated_at)}</div></div><div><span class="foy-label">Ürün Çeşidi</span><span class="foy-value">${x.product_count}</span></div><div><span class="foy-label">Toplam Adet</span><span class="foy-value">${x.total_qty}</span></div><div><span class="foy-label">İndirim</span><span class="foy-value">${money(x.discount)}</span></div><div><span class="foy-label">Genel Toplam</span><span class="foy-value">${money(x.total)}</span></div><a class="foy-detail-btn" href="${detailBase.replace('__ID__',x.id)}">Detay</a></div>`).join('');
 }catch(e){list.innerHTML='<div class="foy-empty">'+esc(e.message)+'</div>';}
});
</script>
{% endblock %}
