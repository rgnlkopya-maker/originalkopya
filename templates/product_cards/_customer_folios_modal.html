<style>
.customer-folios-button[hidden]{display:none!important}.customer-folios-modal .modal-dialog{width:96vw;max-width:96vw;height:92vh;margin:4vh auto}.customer-folios-modal .modal-content{height:92vh;border:0;border-radius:18px;overflow:hidden}.customer-folios-modal .modal-header{flex:0 0 auto;border-bottom:1px solid #e8ecf3;padding:16px 18px}.customer-folios-modal .modal-body{flex:1 1 auto;background:#f7f9fc;padding:16px;min-height:0;overflow-y:auto}.customer-folios-popup-list{display:grid;gap:10px}.customer-folios-popup-card{width:100%;border:1px solid #e3e8f1;border-radius:14px;background:#fff;padding:14px 15px;display:grid;grid-template-columns:90px 145px repeat(3,minmax(100px,1fr)) auto;gap:12px;align-items:center;text-align:left;color:#30394b}.customer-folios-popup-card:hover{border-color:#b9c3ef;background:#fbfbff}.customer-folios-popup-label{display:block;font-size:9px;font-weight:850;text-transform:uppercase;color:#8a94a6;margin-bottom:3px}.customer-folios-popup-value{font-weight:800}.customer-folios-popup-status{display:inline-flex;border-radius:16px;padding:5px 9px;background:#f0f2ff;color:#4650d8;font-size:11px;font-weight:850}.customer-folios-popup-status.transferred{background:#edf8f1;color:#247348}.customer-folios-popup-open{color:#3b45d9;font-size:20px;font-weight:900}.customer-folios-popup-empty,.customer-folios-popup-loading{background:#fff;border:1px dashed #cfd7e6;border-radius:14px;padding:42px 18px;text-align:center;color:#7c879b}.customer-folios-popup-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.customer-folios-popup-nav{display:flex;gap:7px}.customer-folios-popup-nav button,.customer-folios-popup-back{border:1px solid #dce2ee;background:#fff;color:#39445a;border-radius:10px;padding:8px 12px;font-weight:750}.customer-folios-popup-nav button:disabled{opacity:.4}.customer-folios-popup-meta{background:#fff;border:1px solid #e3e8f1;border-radius:14px;padding:13px 15px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:11px}.customer-folios-popup-product{background:#fff;border:1px solid #e3e8f1;border-radius:14px;margin-bottom:10px;overflow:hidden}.customer-folios-popup-product-head{display:flex;justify-content:space-between;gap:12px;padding:13px 15px;background:#fbfcfe;border-bottom:1px solid #edf0f5}.customer-folios-popup-price-wrap{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}.customer-folios-popup-code{font-size:17px;font-weight:900}.customer-folios-popup-price{font-weight:900;color:#263b80}.customer-folios-popup-use-price{border:1px solid #263b80;background:#263b80;color:#fff;border-radius:9px;padding:7px 10px;font-size:11px;font-weight:850}.customer-folios-popup-table{overflow:auto}.customer-folios-popup-table table{width:100%;min-width:520px;border-collapse:collapse}.customer-folios-popup-table th{background:#f7f8fb;color:#727d91;font-size:10px;text-align:left;padding:8px 11px}.customer-folios-popup-table td{padding:9px 11px;border-top:1px solid #edf0f5;font-size:12px}.customer-folios-popup-totals{background:#fff;border:1px solid #e3e8f1;border-radius:14px;padding:13px 15px;margin-left:auto;max-width:390px}.customer-folios-popup-total{display:flex;justify-content:space-between;gap:15px;padding:5px 0}.customer-folios-popup-total.grand{border-top:1px solid #e3e8f1;margin-top:5px;padding-top:10px;font-size:17px;font-weight:900}@media(max-width:850px){.customer-folios-popup-card{grid-template-columns:1fr 1fr}.customer-folios-popup-open{display:none}.customer-folios-popup-meta{grid-template-columns:1fr 1fr}}@media(max-width:560px){.customer-folios-modal .modal-dialog{width:98vw;max-width:98vw;height:96vh;margin:2vh auto}.customer-folios-modal .modal-content{height:96vh;border-radius:14px}.customer-folios-modal .modal-body{padding:10px}.customer-folios-popup-product-head{align-items:flex-start;flex-direction:column}.customer-folios-popup-price-wrap{align-items:flex-start;justify-content:flex-start}.customer-folios-popup-toolbar{align-items:stretch;flex-direction:column}.customer-folios-popup-nav button{flex:1}.customer-folios-popup-totals{max-width:none}}
</style>
<div class="modal fade customer-folios-modal" id="customerFoliosModal" tabindex="-1" aria-hidden="true">
 <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
  <div class="modal-header"><div><h5 class="modal-title mb-0" id="customerFoliosModalTitle">Sipariş Föyleri</h5><div class="small text-muted" id="customerFoliosModalSubtitle"></div></div><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="customerFoliosModalBody"><div class="customer-folios-popup-loading">Föyler yükleniyor…</div></div>
 </div></div>
</div>
<script>
(function(){
 const DATA_URL='{% url "showroom_customer_folios_data" 0 %}',modalEl=document.getElementById('customerFoliosModal'),body=document.getElementById('customerFoliosModalBody'),title=document.getElementById('customerFoliosModalTitle'),subtitle=document.getElementById('customerFoliosModalSubtitle');
 let folios=[],activeIndex=0;
 function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function money(v){return new Intl.NumberFormat('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(v)||0)+' TL';}
 function syncButton(button){const selector=button.dataset.customerSelect;if(!selector)return;const select=document.querySelector(selector),id=select?select.value:'';button.dataset.customerId=id||'';button.hidden=!id;}
 function syncAll(){document.querySelectorAll('.customer-folios-button[data-folios-popup]').forEach(syncButton);}
 function renderList(){
  subtitle.textContent=folios.length+' kayıt';
  if(!folios.length){body.innerHTML='<div class="customer-folios-popup-empty">Bu müşteriye ait kayıtlı sipariş föyü bulunmuyor.</div>';return;}
  body.innerHTML='<div class="customer-folios-popup-list">'+folios.map((f,i)=>`<button type="button" class="customer-folios-popup-card" data-folio-index="${i}"><div><span class="customer-folios-popup-label">Föy No</span><span class="customer-folios-popup-value">#${f.id}</span></div><div><span class="customer-folios-popup-label">Durum</span><span class="customer-folios-popup-status ${f.status==='TRANSFERRED'?'transferred':''}">${esc(f.status_label)}</span></div><div><span class="customer-folios-popup-label">Ürün Çeşidi</span><span class="customer-folios-popup-value">${f.summary.product_count}</span></div><div><span class="customer-folios-popup-label">Toplam Adet</span><span class="customer-folios-popup-value">${f.summary.total_qty}</span></div><div><span class="customer-folios-popup-label">Genel Toplam</span><span class="customer-folios-popup-value">${money(f.summary.total)}</span><div class="small text-muted">${esc(f.updated_at)}</div></div><span class="customer-folios-popup-open">›</span></button>`).join('')+'</div>';
 }
 function renderDetail(index){
  activeIndex=index;const f=folios[index];if(!f)return;subtitle.textContent=`Föy #${f.id} · ${f.status_label}`;
  const canUsePrice=Boolean(document.querySelector('input[name="satis_fiyati"]'));const products=f.items.length?f.items.map(item=>{const rows=(item.satirlar||[]).map(row=>`<tr><td>${esc(row.renk||'—')}</td><td>${esc((row.bedenler||[]).join(', ')||'—')}</td><td>${esc(row.adet)}</td><td>${esc(row.aciklama||'—')}</td></tr>`).join(''),useButton=canUsePrice?`<button type="button" class="customer-folios-popup-use-price" data-use-folio-price data-price="${esc(item.anlasilan_fiyat)}" data-currency="${esc(f.currency||'TRY')}" data-product-code="${esc(item.urun_kodu)}">Baz Fiyatı Kullan</button>`:'';return `<section class="customer-folios-popup-product"><div class="customer-folios-popup-product-head"><span class="customer-folios-popup-code">${esc(item.urun_kodu)}</span><span class="customer-folios-popup-price-wrap"><span class="customer-folios-popup-price">Anlaşılan Fiyat: ${money(item.anlasilan_fiyat)}</span>${useButton}</span></div><div class="customer-folios-popup-table"><table><thead><tr><th>Renk</th><th>Beden</th><th>Adet</th><th>Açıklama</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;}).join(''):'<div class="customer-folios-popup-empty">Bu föyde ürün bulunmuyor.</div>';
  body.innerHTML=`<div class="customer-folios-popup-toolbar"><button type="button" class="customer-folios-popup-back" data-folio-back><i class="bi bi-arrow-left"></i> Föy Listesi</button><div class="customer-folios-popup-nav"><button type="button" data-folio-prev ${index===0?'disabled':''}>← Önceki</button><button type="button" data-folio-next ${index===folios.length-1?'disabled':''}>Sonraki →</button></div></div><div class="customer-folios-popup-meta"><div><span class="customer-folios-popup-label">Föy No</span><span class="customer-folios-popup-value">#${f.id}</span></div><div><span class="customer-folios-popup-label">Durum</span><span class="customer-folios-popup-value">${esc(f.status_label)}</span></div><div><span class="customer-folios-popup-label">Toplam Adet</span><span class="customer-folios-popup-value">${f.summary.total_qty}</span></div><div><span class="customer-folios-popup-label">Siparişi Alan</span><span class="customer-folios-popup-value">${esc(f.order_taken_by||'—')}</span></div><div><span class="customer-folios-popup-label">Son Güncelleme</span><span class="customer-folios-popup-value">${esc(f.updated_at)}</span></div></div>${products}<div class="customer-folios-popup-totals"><div class="customer-folios-popup-total"><span>Ara Toplam</span><strong>${money(f.summary.subtotal)}</strong></div><div class="customer-folios-popup-total"><span>İndirim</span><strong>-${money(f.summary.discount)}</strong></div><div class="customer-folios-popup-total"><span>KDV (%${Number(f.summary.vat_rate||0).toLocaleString('tr-TR')})</span><strong>${money(f.summary.vat)}</strong></div><div class="customer-folios-popup-total"><span>Föy Toplamı</span><strong>${money(f.summary.folio_total)}</strong></div><div class="customer-folios-popup-total"><span>Eski Bakiye</span><strong>${money(f.summary.previous_balance)}</strong></div><div class="customer-folios-popup-total grand"><span>Genel Toplam</span><span>${money(f.summary.total)}</span></div></div>`;
 }
 async function openFolios(button){
  const customerId=button.dataset.customerId;if(!customerId)return;title.textContent='Sipariş Föyleri';subtitle.textContent='';body.innerHTML='<div class="customer-folios-popup-loading">Föyler yükleniyor…</div>';bootstrap.Modal.getOrCreateInstance(modalEl).show();
  try{const response=await fetch(DATA_URL.replace('/0/','/'+encodeURIComponent(customerId)+'/'),{credentials:'same-origin'}),data=await response.json();if(!response.ok||!data.ok)throw new Error(data.message||'Föyler alınamadı.');folios=data.folios||[];title.textContent=data.customer.name+' · Sipariş Föyleri';renderList();}catch(error){body.innerHTML='<div class="customer-folios-popup-empty">'+esc(error.message||'Föyler alınamadı.')+'</div>';}
 }
 document.addEventListener('change',function(event){document.querySelectorAll('.customer-folios-button[data-customer-select]').forEach(button=>{if(event.target.matches(button.dataset.customerSelect))syncButton(button);});});
 document.addEventListener('click',function(event){const trigger=event.target.closest('.customer-folios-button[data-folios-popup]');if(trigger){openFolios(trigger);return;}const usePrice=event.target.closest('[data-use-folio-price]');if(usePrice){const priceInput=document.querySelector('input[name="satis_fiyati"]'),currencyInput=document.querySelector('input[name="para_birimi"]'),productSelect=document.getElementById('urun_kodu_select');if(priceInput){priceInput.value=usePrice.dataset.price||'';priceInput.dispatchEvent(new Event('input',{bubbles:true}));}if(currencyInput)currencyInput.value=usePrice.dataset.currency||'TRY';if(productSelect){const wanted=String(usePrice.dataset.productCode||'').toLocaleLowerCase('tr'),option=Array.from(productSelect.options).find(o=>String(o.value).toLocaleLowerCase('tr')===wanted);if(option){productSelect.value=option.value;productSelect.dispatchEvent(new Event('change',{bubbles:true}));}}bootstrap.Modal.getOrCreateInstance(modalEl).hide();return;}const card=event.target.closest('[data-folio-index]');if(card){renderDetail(Number(card.dataset.folioIndex));return;}if(event.target.closest('[data-folio-back]')){renderList();return;}if(event.target.closest('[data-folio-prev]')&&activeIndex>0){renderDetail(activeIndex-1);return;}if(event.target.closest('[data-folio-next]')&&activeIndex<folios.length-1)renderDetail(activeIndex+1);});
 window.MoliCustomerFolios={sync:syncAll,setCustomer:function(button,id){const el=typeof button==='string'?document.querySelector(button):button;if(!el)return;el.dataset.customerId=id||'';el.hidden=!id;}};
 document.addEventListener('DOMContentLoaded',syncAll);syncAll();
})();
</script>
