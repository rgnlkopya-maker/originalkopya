<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sepet Kodu | Moli</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ec;color:#241d1a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.page{max-width:480px;margin:auto;padding:40px 16px}.brand{text-align:center;font-size:13px;letter-spacing:.22em;font-weight:800}.box{margin-top:20px;background:#fff;border:1px solid #e3dbd4;border-radius:20px;padding:22px}.title{text-align:center;font-size:24px;font-weight:850}.sub{text-align:center;color:#756b65;font-size:13px;margin:7px 0 18px}.code{width:100%;height:58px;border:1px solid #d9d0c8;border-radius:14px;text-align:center;font-size:28px;font-weight:850;letter-spacing:.16em}.btn{width:100%;margin-top:12px;padding:16px;border:0;border-radius:14px;background:#241d1a;color:#fff;font-size:16px;font-weight:800}.error{margin-top:12px;padding:12px;border-radius:12px;background:#fbe5e2;color:#8b3029;font-size:13px}</style></head><body><main class="page"><div class="brand">MOLİ</div><div class="box"><div class="title">Müşteri Sepet Kodu</div><div class="sub">Müşterinin telefonunda görünen 6 haneli kodu girin.</div><form method="post">{% csrf_token %}<input class="code" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" autofocus><button class="btn" type="submit">Sepeti Gör</button></form>{% if error %}<div class="error">{{ error }}</div>{% endif %}</div></main></body></html>
