{% extends "base.html" %}
{% block extra_css %}<style>
.ce{max-width:1150px;margin:0 auto;padding:20px 12px 45px}.ce-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.ce-head h1{font-size:23px;font-weight:850;margin:0}.ce-head p{font-size:11px;color:#8992a4;margin:4px 0 0}.cardx{background:#fff;border:1px solid #e6eaf2;border-radius:18px;padding:18px;box-shadow:0 7px 22px rgba(15,23,42,.05);margin-bottom:12px}.cardx h3{font-size:13px;font-weight:850;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}.field label{display:block;font-size:9px;font-weight:800;color:#7d8799;text-transform:uppercase;margin:0 0 5px}.field input,.field textarea{width:100%;border:1px solid #dfe4ed;border-radius:11px;padding:10px 11px;background:#fff;font-size:13px;outline:none}.field input:focus,.field textarea:focus{border-color:#8494ff;box-shadow:0 0 0 3px rgba(74,99,255,.08)}.field textarea{min-height:82px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px}.btnx{height:42px;border-radius:12px;padding:0 16px;border:1px solid #dfe4ed;background:#fff;color:#39405a;text-decoration:none;font-weight:750;display:inline-flex;align-items:center}.btnx.primary{background:#4a63ff;border-color:#4a63ff;color:#fff}.activebox{display:flex;align-items:center;gap:8px;height:42px}.activebox input{width:18px;height:18px}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.ce-head{align-items:flex-start;flex-direction:column}}
</style>{% endblock %}
{% block content %}<main class="ce"><div class="ce-head"><div><h1>{{ customer.ad }}</h1><p>Müşterinin kalıcı iletişim, adres ve ticari bilgileri.</p></div><a class="btnx" href="{% url 'customer_detail_report' customer.id %}">Müşteri Kartına Dön</a></div><form method="post">{% csrf_token %}<section class="cardx"><h3>Temel Bilgiler</h3><div class="grid"><div class="field"><label>Müşteri / Firma Adı</label><input name="ad" value="{{ customer.ad }}" required></div><div class="field"><label>Yetkili Kişi</label><input name="yetkili_kisi" value="{{ detail.yetkili_kisi }}"></div><div class="field"><label>Telefon</label><input name="telefon" value="{{ detail.telefon }}" inputmode="tel"></div><div class="field"><label>İkinci Telefon</label><input name="telefon_2" value="{{ detail.telefon_2 }}" inputmode="tel"></div><div class="field"><label>E-posta</label><input type="email" name="email" value="{{ detail.email }}"></div><div class="field"><label>Ülke</label><input name="ulke" value="{{ detail.ulke }}"></div><div class="field full"><label>Çalıştığı Dış Ticaret Firması</label><input name="dis_ticaret_firmasi" value="{{ detail.dis_ticaret_firmasi }}"></div><div class="field full"><label>Durum</label><div class="activebox"><input type="checkbox" name="aktif" id="aktif" {% if customer.aktif %}checked{% endif %}><label for="aktif" style="margin:0;text-transform:none;font-size:12px">Aktif müşteri</label></div></div></div></section><section class="cardx"><h3>Adresler</h3><div class="grid"><div class="field full"><label>Adres</label><textarea name="adres">{{ detail.adres }}</textarea></div><div class="field"><label>Teslimat Adresi</label><textarea name="teslimat_adresi">{{ detail.teslimat_adresi }}</textarea></div><div class="field"><label>Fatura Adresi</label><textarea name="fatura_adresi">{{ detail.fatura_adresi }}</textarea></div></div></section><section class="cardx"><h3>Müşteri Notları</h3><div class="field"><label>Notlar</label><textarea name="notlar" style="min-height:110px">{{ detail.notlar }}</textarea></div></section><div class="actions"><a class="btnx" href="{% url 'customer_detail_report' customer.id %}">Vazgeç</a><button class="btnx primary" type="submit"><i class="bi bi-check2 me-1"></i>Bilgileri Kaydet</button></div></form></main>{% endblock %}
