{% extends "base.html" %}
{% block extra_css %}<style>
.salary-lock-screen{min-height:65vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;background:rgba(22,38,62,.045)}
.salary-lock-card{width:100%;max-width:420px;border:1px solid #e3eaf2;background:#fff;box-shadow:0 20px 55px rgba(24,47,81,.14);border-radius:20px;padding:32px}
.salary-lock-icon{height:54px;width:54px;border-radius:16px;background:#edf4ff;color:#376bb0;display:grid;place-items:center;font-size:24px;margin-bottom:18px}
.salary-lock-card h1{font-size:22px;font-weight:800;color:#1c2e48}
.salary-lock-card p{font-size:13px;color:#718099;margin:9px 0 22px}
.salary-lock-card label{font-size:12px;font-weight:750;color:#4a5b74;margin-bottom:7px}
.salary-lock-card .form-control{padding:11px 13px;border-radius:10px}
.salary-lock-card .btn{width:100%;padding:10px;margin-top:17px;border-radius:10px}
</style>{% endblock %}
{% block content %}
<div class="salary-lock-screen">
 <section class="salary-lock-card" role="dialog" aria-modal="true" aria-labelledby="salary-lock-title">
  <div class="salary-lock-icon"><i class="bi bi-shield-lock"></i></div>
  <h1 id="salary-lock-title">Puantaj · Güvenli Giriş</h1>
  <p>Puantaj kayıtlarını görüntülemek için oturum açmış olduğunuz hesabın şifresini doğrulayın.</p>
  {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{% url 'attendance_password_gate' %}" autocomplete="off">{% csrf_token %}
   <label for="salary-password">Kullanıcı şifreniz</label>
   <input id="salary-password" type="password" name="password" class="form-control" autocomplete="current-password" required autofocus>
   <button type="submit" class="btn btn-primary"><i class="bi bi-unlock"></i> Puantaj Sayfasını Aç</button>
  </form>
 </section>
</div>
{% endblock %}
