<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moli Puantaj QR</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#18211f;background:#f3f4f6}
    body{padding:30px}
    .sheet{max-width:720px;margin:0 auto;background:#fff;border-radius:24px;padding:48px 42px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.08)}
    .brand,.app,.instruction,.location,.footer,.qr-wrap,.actions{text-align:center;width:100%;margin-left:auto;margin-right:auto}
    .brand{font-family:Georgia,"Times New Roman",serif;font-size:34px;letter-spacing:6px;margin-bottom:7px}
    .app{font-size:18px;letter-spacing:1px;color:#6b7280;margin-bottom:34px}
    .instruction{font-size:20px;font-weight:700;line-height:1.5;max-width:570px;margin-bottom:8px}
    .location{font-size:18px;line-height:1.5;color:#4b5563;margin-bottom:24px}
    .qr-wrap{margin-top:6px;margin-bottom:26px}
    .qr-wrap img{display:block;width:360px;max-width:85%;height:auto;margin:0 auto}
    .footer{font-size:13px;letter-spacing:1px;color:#6b7280;margin-top:8px}
    .actions{margin-top:28px}
    button{border:0;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:700;cursor:pointer;background:#303634;color:#fff}
    @media print{
      @page{size:A4;margin:0}
      html,body{width:210mm;height:297mm;background:#fff}
      body{padding:0}
      .sheet{width:210mm;min-height:297mm;max-width:none;margin:0;padding:34mm 20mm 20mm;border-radius:0;box-shadow:none;text-align:center}
      .actions{display:none}
    }
  </style>
</head>
<body>
  <main class="sheet">
    <div class="brand">MOLİ TEXTILE</div>
    <div class="app">MoliApp</div>

    <div class="instruction">Mesainiz başlarken ve mesainiz biterken QR kodunu okutun.</div>
    <div class="location">Konum doğrulamasına izin verin.</div>

    <div class="qr-wrap">
      <img src="{% url 'attendance_qr_image' %}" alt="Moli Puantaj QR">
    </div>

    <div class="footer">Moli Tekstil • İzmir</div>
    <div class="actions"><button onclick="window.print()">Yazdır</button></div>
  </main>
</body>
</html>
