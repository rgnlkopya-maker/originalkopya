{% extends "base.html" %}
{% block extra_css %}<style>.salary-home{max-width:1240px;margin:22px auto;padding:0 12px 50px}.salary-home h1{font-size:27px;font-weight:800;color:#14233a}.salary-nav-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:22px}.salary-nav-card{display:flex;align-items:center;gap:15px;padding:24px;background:#fff;border:1px solid #e4eaf2;border-radius:18px;color:#24344b;text-decoration:none;box-shadow:0 6px 22px #1022440d;transition:.2s}.salary-nav-card:hover{border-color:#91b5ee;transform:translateY(-2px);color:#194b83}.salary-nav-icon{display:grid;place-items:center;width:49px;height:49px;background:#edf4ff;color:#3266b1;border-radius:13px;font-size:23px}.salary-nav-copy{display:grid;gap:5px}.salary-nav-copy strong{font-size:17px}.salary-nav-copy small{font-size:12px;color:#6c7b92}.salary-nav-arrow{margin-left:auto;color:#6688b2}@media(max-width:650px){.salary-nav-cards{grid-template-columns:1fr}}</style>{% endblock %}
{% block content %}<div class="salary-home"><h1>Maaş Yönetimi</h1><nav class="salary-nav-cards" aria-label="Maaş yönetimi"><a class="salary-nav-card" href="{% url 'salary_dashboard' %}"><span class="salary-nav-icon"><i class="bi bi-wallet2"></i></span><span class="salary-nav-copy"><strong>Maaş Ödeme</strong><small>Ödemeler, avanslar ve kalan bakiye</small></span><i class="bi bi-arrow-right salary-nav-arrow"></i></a><a class="salary-nav-card" href="{% url 'salary_definitions' %}"><span class="salary-nav-icon"><i class="bi bi-person-lines-fill"></i></span><span class="salary-nav-copy"><strong>Maaş Tanımları</strong><small>Ücret dönemleri ve geçmiş kayıtlar</small></span><i class="bi bi-arrow-right salary-nav-arrow"></i></a></nav></div><script>
window.addEventListener("pageshow", function (event) {
  if (event.persisted) {
    var url = new URL(window.location.href);
    url.searchParams.set("salary_reauth", "1");
    window.location.replace(url.toString());
  }
});
</script>
{% endblock %}
