<script>
$(document).ready(function () {
    function normalizeText(value) {
        return (value || "").toLocaleLowerCase("tr").trim();
    }

    function ensureAutocompleteStyles() {
        if (document.getElementById("moli-autocomplete-styles")) return;
        const style = document.createElement("style");
        style.id = "moli-autocomplete-styles";
        style.textContent = `
            .moli-autocomplete { position: relative; width: 100%; }
            .moli-autocomplete-input {
                width: 100%; min-height: 44px; background: #f9fafb;
                border: 1px solid #e5e7eb; border-radius: 10px;
                padding: 10px 12px; font-size: 14px; color: #111827;
                outline: none;
            }
            .moli-autocomplete-input:focus {
                border-color: #6366f1;
                box-shadow: 0 0 0 3px rgba(99,102,241,0.25);
            }
            .moli-autocomplete-menu {
                display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
                z-index: 2000; max-height: 260px; overflow-y: auto;
                background: #fff; border: 1px solid #d1d5db; border-radius: 10px;
                box-shadow: 0 10px 28px rgba(0,0,0,.14); padding: 4px 0;
            }
            .moli-autocomplete.open .moli-autocomplete-menu { display: block; }
            .moli-autocomplete-option {
                display: block; width: 100%; border: 0; background: #fff;
                text-align: left; padding: 10px 12px; font-size: 14px; color: #111827;
                cursor: pointer;
            }
            .moli-autocomplete-option:hover,
            .moli-autocomplete-option.active { background: #eef2ff; }
            .moli-autocomplete-empty { padding: 10px 12px; color: #6b7280; font-size: 13px; }
            .moli-autocomplete-source {
                position: absolute !important; width: 1px !important; height: 1px !important;
                opacity: 0 !important; pointer-events: none !important; left: -9999px !important;
            }
        `;
        document.head.appendChild(style);
    }

    function optionList(select) {
        return Array.from(select.options).filter(function (opt) {
            return opt.value && opt.textContent.trim();
        });
    }

    function buildAutocomplete(select) {
        if (!select || select.dataset.autocompleteReady === "1") return;
        select.dataset.autocompleteReady = "1";
        select.classList.remove("select2");
        select.classList.add("moli-autocomplete-source");

        const wrapper = document.createElement("div");
        wrapper.className = "moli-autocomplete";

        const input = document.createElement("input");
        input.type = "text";
        input.className = "moli-autocomplete-input";
        input.autocomplete = "off";
        input.placeholder = "Seçiniz";
        if (select.required) {
            input.required = true;
            select.required = false;
        }

        const menu = document.createElement("div");
        menu.className = "moli-autocomplete-menu";

        select.parentNode.insertBefore(wrapper, select);
        wrapper.appendChild(input);
        wrapper.appendChild(menu);
        wrapper.appendChild(select);

        function syncInputFromSelect() {
            const selected = select.options[select.selectedIndex];
            input.value = selected && selected.value ? selected.textContent.trim() : "";
        }

        function render(term) {
            const q = normalizeText(term);
            const matches = optionList(select).filter(function (opt) {
                return !q || normalizeText(opt.textContent).includes(q);
            });
            menu.innerHTML = "";
            if (!matches.length) {
                const empty = document.createElement("div");
                empty.className = "moli-autocomplete-empty";
                empty.textContent = "Sonuç bulunamadı";
                menu.appendChild(empty);
                return;
            }
            matches.slice(0, 100).forEach(function (opt) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.className = "moli-autocomplete-option";
                btn.textContent = opt.textContent.trim();
                btn.dataset.value = opt.value;
                btn.addEventListener("mousedown", function (e) {
                    e.preventDefault();
                });
                btn.addEventListener("click", function () {
                    select.value = opt.value;
                    input.value = opt.textContent.trim();
                    wrapper.classList.remove("open");
                    select.dispatchEvent(new Event("change", { bubbles: true }));
                    input.dispatchEvent(new Event("change", { bubbles: true }));
                });
                menu.appendChild(btn);
            });
        }

        input.addEventListener("focus", function () {
            render(input.value);
            wrapper.classList.add("open");
        });

        input.addEventListener("click", function () {
            render(input.value);
            wrapper.classList.add("open");
        });

        input.addEventListener("input", function () {
            const typed = input.value;
            const exact = optionList(select).find(function (opt) {
                return normalizeText(opt.textContent) === normalizeText(typed);
            });
            select.value = exact ? exact.value : "";
            if (exact) select.dispatchEvent(new Event("change", { bubbles: true }));
            render(typed);
            wrapper.classList.add("open");
        });

        input.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                wrapper.classList.remove("open");
                return;
            }
            if (e.key === "Enter") {
                const first = menu.querySelector(".moli-autocomplete-option");
                if (first && wrapper.classList.contains("open")) {
                    e.preventDefault();
                    first.click();
                }
            }
        });

        input.addEventListener("blur", function () {
            setTimeout(function () {
                wrapper.classList.remove("open");
                if (!select.value) {
                    const exact = optionList(select).find(function (opt) {
                        return normalizeText(opt.textContent) === normalizeText(input.value);
                    });
                    if (exact) {
                        select.value = exact.value;
                        input.value = exact.textContent.trim();
                        select.dispatchEvent(new Event("change", { bubbles: true }));
                    }
                }
            }, 120);
        });

        $(select).on("change.autocompleteSync", syncInputFromSelect);
        syncInputFromSelect();
    }

    function initAutocomplete(context) {
        const root = context instanceof Element ? context : document;
        root.querySelectorAll("#musteri_select, #urun_kodu_select, .renk-select").forEach(buildAutocomplete);
    }

    function initSelect2(context) {
        const $context = $(context);
        $context.find("select.select2[multiple], select.select2[multiple='']").not(".renk-select").select2({
            placeholder: "Beden seçiniz",
            closeOnSelect: false,
            allowClear: true,
            width: "100%",
            minimumResultsForSearch: 0
        });
        $context.find(".beden-select").each(function () {
            $(this).off("select2:select.closeSize").on("select2:select.closeSize", function () {
                $(this).select2("close");
            });
        });
        $context.find(".select2:not([multiple])").not("#musteri_select,#urun_kodu_select,.renk-select").select2({
            placeholder: "Seçiniz",
            allowClear: true,
            width: "100%",
            minimumResultsForSearch: 0
        });
    }

    ensureAutocompleteStyles();
    initSelect2(document);
    initAutocomplete(document);

    document.addEventListener("click", function (e) {
        document.querySelectorAll(".moli-autocomplete.open").forEach(function (wrapper) {
            if (!wrapper.contains(e.target)) wrapper.classList.remove("open");
        });
    });

    $("#urun_kodu_select").on("change", function () {
        const selected = this.options[this.selectedIndex];
        const urunTipi = selected ? selected.dataset.urunTipi : "";
        $("#urun_tipi_select").val(urunTipi || "").trigger("change");
    });

    const imageInput = document.getElementById("order-images");
    const imagePreview = document.getElementById("order-images-preview");
    const imageSummary = document.getElementById("order-images-summary");
    if (imageInput) {
        imageInput.addEventListener("change", function () {
            imagePreview.innerHTML = "";
            const files = Array.from(this.files || []);
            imageSummary.textContent = files.length ? files.length + " fotoğraf seçildi." : "Henüz fotoğraf seçilmedi.";
            files.forEach(function (file) {
                if (!file.type.startsWith("image/")) return;
                const img = document.createElement("img");
                img.style.width = "82px";
                img.style.height = "82px";
                img.style.objectFit = "cover";
                img.style.borderRadius = "10px";
                img.style.border = "1px solid #e5e7eb";
                img.alt = file.name;
                const reader = new FileReader();
                reader.onload = e => img.src = e.target.result;
                reader.readAsDataURL(file);
                imagePreview.appendChild(img);
            });
        });
    }

    let priceHistory = [];
    function escapeHtml(value) {
        return $("<div>").text(value == null ? "" : String(value)).html();
    }
    function refreshPriceHistory() {
        const customerId = $("#musteri_select").val();
        const productCode = $("#urun_kodu_select").val();
        const area = $("#price-history-area");
        const summary = $("#last-price-summary");
        priceHistory = [];
        summary.text("");
        if (!area.length) return;
        if (!customerId || !productCode) {
            area.hide();
            return;
        }
        area.show();
        summary.text("Geçmiş fiyat aranıyor...");
        $.get("{% url 'customer_product_price_history' %}", { musteri: customerId, urun_kodu: productCode })
            .done(function (data) {
                priceHistory = data.results || [];
                if (priceHistory.length) {
                    const last = priceHistory[0];
                    summary.html("Son fiyat: <strong>" + escapeHtml(last.satis_fiyati) + " " + escapeHtml(last.para_birimi) + "</strong> · " + escapeHtml(last.siparis_tipi) + " · " + escapeHtml(last.urun_tipi));
                } else {
                    summary.text("Bu müşteri ve ürün için geçmiş fiyat yok.");
                }
            })
            .fail(function () {
                summary.text("Geçmiş fiyat bilgisi alınamadı.");
            });
    }
    $("#musteri_select, #urun_kodu_select").on("change", refreshPriceHistory);

    $("#priceHistoryModal").on("show.bs.modal", function () {
        const customerName = $("#musteri_select option:selected").text();
        const productCode = $("#urun_kodu_select").val();
        const list = $("#price-history-list");
        const empty = $("#price-history-empty");
        const loading = $("#price-history-loading");
        $("#price-history-subtitle").text(customerName + " · " + productCode + " · son 10 sevk edilmiş sipariş");
        list.empty();
        loading.hide();
        if (!priceHistory.length) {
            empty.show();
            return;
        }
        empty.hide();
        priceHistory.forEach(function (item) {
            const price = escapeHtml(item.satis_fiyati + " " + item.para_birimi);
            list.append(`<div class="list-group-item p-3"><div class="d-flex justify-content-between gap-3 align-items-start"><div><div class="fw-bold">${escapeHtml(item.urun_kodu)} · ${escapeHtml(item.urun_tipi)}</div><div class="small mt-1"><span class="badge text-bg-light border">${escapeHtml(item.siparis_tipi)}</span> <span class="text-muted ms-1">${escapeHtml(item.siparis_numarasi)}</span></div><div class="small text-muted mt-1">Sipariş: ${escapeHtml(item.siparis_tarihi)} · Sevkiyat: ${escapeHtml(item.sevkiyat_tarihi)}</div></div><div class="text-end"><div class="fw-bold fs-5">${price}</div><button type="button" class="btn btn-sm btn-outline-primary mt-2 use-old-price" data-price="${escapeHtml(item.satis_fiyati)}" data-currency="${escapeHtml(item.para_birimi)}">Bu fiyatı kullan</button></div></div></div>`);
        });
    });

    $(document).on("click", ".use-old-price", function () {
        $("input[name='satis_fiyati']").val($(this).data("price"));
        $("input[name='para_birimi']").val($(this).data("currency"));
        bootstrap.Modal.getOrCreateInstance(document.getElementById("priceHistoryModal")).hide();
    });

    let index = 1;
    $("#add-row").click(function () {
        let row = `<div class="row mb-3 renk-beden-row" data-index="${index}"><div class="col-md-3"><label class="form-label">Renk</label><select name="renk_row_${index}" class="form-select renk-select"><option></option>{% for r in renkler %}<option value="{{ r.ad }}">{{ r.ad }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">Bedenler</label><select name="beden_row_${index}[]" class="form-select select2 beden-select" multiple>{% for b in bedenler %}<option value="{{ b.ad }}">{{ b.ad }}</option>{% endfor %}</select></div><div class="col-md-2"><label class="form-label">Adet</label><input type="number" min="1" value="1" name="adet_row_${index}" class="form-control"></div><div class="col-md-3"><label class="form-label">Müşteri Ref</label><input type="text" name="musteri_ref_row_${index}" class="form-control"></div><div class="col-12 mt-2"><button type="button" class="btn btn-danger remove-row">Sil</button></div></div>`;
        $("#rows-container").append(row);
        const rowEl = document.querySelector(`.renk-beden-row[data-index="${index}"]`);
        initSelect2(rowEl);
        initAutocomplete(rowEl);
        index++;
    });

    $(document).on("click", ".remove-row", function () {
        $(this).closest(".renk-beden-row").remove();
    });

    $("#siparis_tipi_select").on("change", function () {
        const tip = $(this).val();
        const musteriSelect = document.getElementById("musteri_select");
        const musteriDiv = $(musteriSelect).closest(".col-md-4");
        if (tip === "STOK") {
            musteriSelect.value = "";
            $(musteriSelect).trigger("change");
            const visibleInput = musteriDiv.find(".moli-autocomplete-input")[0];
            if (visibleInput) visibleInput.value = "";
            musteriDiv.hide();
        } else {
            musteriDiv.show();
        }
    }).trigger("change");

    const form = document.querySelector("form[method='POST']");
    if (form) {
        form.addEventListener("submit", function (e) {
            const tip = $("#siparis_tipi_select").val();
            if (tip !== "STOK" && !document.getElementById("musteri_select").value) {
                e.preventDefault();
                alert("Lütfen listeden bir müşteri seçin.");
                return;
            }
            if (!document.getElementById("urun_kodu_select").value) {
                e.preventDefault();
                alert("Lütfen listeden bir ürün kodu seçin.");
                return;
            }
        });
    }
});
</script>
