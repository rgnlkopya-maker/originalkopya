{% if user.is_authenticated %}
<div class="modal fade" id="reminderModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      <div class="modal-header border-0 pb-0">
        <div>
          <div class="text-muted small">HATIRLATMA</div>
          <h5 class="modal-title fw-bold">Bekleyen Hatırlatmalar</h5>
        </div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body pt-3" id="reminderModalBody"></div>
      <div class="modal-footer border-0 pt-0">
        <a href="{% url 'my_reminders' %}" class="btn btn-outline-secondary rounded-pill">Hatırlatmalarım</a>
      </div>
    </div>
  </div>
</div>
{% endif %}
