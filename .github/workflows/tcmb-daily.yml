name: Gunluk TCMB Kur Guncelleme

on:
  schedule:
    - cron: '15 6 * * 1-5'
  workflow_dispatch:

jobs:
  update-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt

      - name: Veritabani baglantisini kontrol et
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub Secret tanimli degil."
            exit 1
          fi

      - name: TCMB kurunu cek ve urun maliyetlerini guncelle
        run: python manage.py update_tcmb_rates
