name: Build Moli Boutique V2 GLB
on:
  workflow_dispatch:
  push:
    branches: [feature/showroom-v2-asset-pipeline]
    paths:
      - 'tools/build_showroom_v2.py'
      - '.github/workflows/build-showroom-v2.yml'
permissions:
  contents: write
jobs:
  build-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender
      - name: Build professional glTF asset
        run: |
          blender --background --python tools/build_showroom_v2.py
          test -s static/showroom/assets/moli-boutique-v2.glb
      - name: Commit generated model to feature branch
        run: |
          git config user.name "moli-showroom-build"
          git config user.email "actions@users.noreply.github.com"
          git add static/showroom/assets/moli-boutique-v2.glb
          if ! git diff --cached --quiet; then
            git commit -m "Build Blender showroom V2 asset [skip ci]"
            git push
          fi
