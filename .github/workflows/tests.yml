name: Django Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: 'ci-only-not-for-production-do-not-reuse-2026'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check for model changes without migrations
        continue-on-error: true
        run: python manage.py makemigrations --check --dry-run
        env:
          DEBUG: 'False'
      - name: Verify BizimHesap invoice line labels (no database)
        run: python manage.py test product_cards.test_bizimhesap_invoice_labels --verbosity 2
        env:
          DEBUG: 'False'
          BASE_URL: 'http://127.0.0.1:8000'
      - name: Verify manager operation notifications (no database)
        run: python manage.py test core.test_manager_notification_signals --verbosity 2
        env:
          DEBUG: 'False'
          BASE_URL: 'http://127.0.0.1:8000'
      - name: Verify centralized notification publishing (no database)
        run: python manage.py test core.test_notification_service --verbosity 2
        env:
          DEBUG: 'False'
          BASE_URL: 'http://127.0.0.1:8000'
      - name: Verify backup center layout (no database)
        run: python manage.py test core.test_backup_center_template --verbosity 2
        env:
          DEBUG: 'False'
          BASE_URL: 'http://127.0.0.1:8000'
      - name: Run tests
        run: python manage.py test --verbosity 2
        env:
          DEBUG: 'False'
          BASE_URL: 'http://127.0.0.1:8000'
          SUPABASE_BUCKET_NAME: 'order-qr'
